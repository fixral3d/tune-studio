	knock_avg = { (knockval7 + knockval6 + knockval5 + knockval4 + knockval3 + knockval2 + knockval1 + knockval0) / (ignchmax + 1) }
	knock_max = { worst_knockval }

; 	avg value for reference
	knock_ref_avg1 = { (knock_calibration_min - 128 + (128 + knock_calibration_max - knock_calibration_min) / 2) }
	knock_ref_avg2 = { (knock_calibration_min + (knock_calibration_max - knock_calibration_min) / 2) }
	knock_ref_avg = { (knock_calibration_min > 127) ? knock_ref_avg1 : knock_ref_avg2 }

; 	calculated value for noise in percents (map in percents too)
	knock_ref_noise = { 100 * ((knock_avg + (knock_max - knock_avg) * (100 + 80) / 100) * ( 100 + 30) / 100) / knock_ref_avg }

;	interpolated knock table value from calc model 
	knock_table_val = { calc_knock_table_val } 

; 	difference betwen map and calculated value in percents (map in percents too)
	knock_noise_diff = { knock_ref_noise - knock_table_val }

