	muxed_ch_low	=	{ switchCase8((mux_mcp_ch_low),raw_adc_ch0,raw_adc_ch1,raw_adc_ch2,raw_adc_ch3,raw_adc_ch4,raw_adc_ch5,raw_adc_ch6,raw_adc_ch7) }
;
; 	start of latch32 test
;
	demuxed_mcp_low = { latch32(0, (comm_mux_state == 0), muxed_ch_low) }
	demuxed_mcp_high = { latch32(1, (comm_mux_state == 0), muxed_ch_high) }
	demuxed_ch8 = { latch32(2, (comm_mux_state == 1), muxed_ch_low) }
	demuxed_ch9 = { latch32(3, (comm_mux_state == 1), muxed_ch_high) }
	demuxed_ch10 = { latch32(4, (comm_mux_state == 2), muxed_ch_low) }
	demuxed_ch11 = { latch32(5, (comm_mux_state == 2), muxed_ch_high) }
	demuxed_ch12 = { latch32(6, (comm_mux_state == 3), muxed_ch_low) }
	demuxed_ch13 = { latch32(7, (comm_mux_state == 3), muxed_ch_high) }
	
	
	raw_v_demuxed_adc_ch8	= { demuxed_ch8 * (5/4096) }
	raw_v_demuxed_adc_ch9	= { demuxed_ch9 * (5/4096) }
	raw_v_demuxed_adc_ch10	= { demuxed_ch10 * (5/4096) }
    raw_v_demuxed_adc_ch11	= { demuxed_ch11 * (5/4096) }
	raw_v_demuxed_adc_ch12	= { demuxed_ch12 * (5/4096) }
	raw_v_demuxed_adc_ch13	= { demuxed_ch12 * (5/4096) }
;	
; 	eof latch32 test	
;
	demuxed_ch0 = { (mux_mcp_ch_high == 0) ? demuxed_mcp_high : ((mux_mcp_ch_low == 0) ? demuxed_mcp_low : raw_adc_ch0) }
	demuxed_ch1 = { (mux_mcp_ch_high == 1) ? demuxed_mcp_high : ((mux_mcp_ch_low == 1) ? demuxed_mcp_low : raw_adc_ch1) }
	demuxed_ch2 = { (mux_mcp_ch_high == 2) ? demuxed_mcp_high : ((mux_mcp_ch_low == 2) ? demuxed_mcp_low : raw_adc_ch2) }
	demuxed_ch3 = { (mux_mcp_ch_high == 3) ? demuxed_mcp_high : ((mux_mcp_ch_low == 3) ? demuxed_mcp_low : raw_adc_ch3) }
	demuxed_ch4 = { (mux_mcp_ch_high == 4) ? demuxed_mcp_high : ((mux_mcp_ch_low == 4) ? demuxed_mcp_low : raw_adc_ch4) }
	demuxed_ch5 = { (mux_mcp_ch_high == 5) ? demuxed_mcp_high : ((mux_mcp_ch_low == 5) ? demuxed_mcp_low : raw_adc_ch5) }
	demuxed_ch6 = { (mux_mcp_ch_high == 6) ? demuxed_mcp_high : ((mux_mcp_ch_low == 6) ? demuxed_mcp_low : raw_adc_ch6) }
	demuxed_ch7 = { (mux_mcp_ch_high == 7) ? demuxed_mcp_high : ((mux_mcp_ch_low == 7) ? demuxed_mcp_low : raw_adc_ch7) }
;	
;	eof demuxed test
;

	raw_v_adc_ch0	= { demuxed_ch0 * (5/4096) }
	raw_v_adc_ch1	= { demuxed_ch1 * (5/4096) }
	raw_v_adc_ch2	= { demuxed_ch2 * (5/4096) }
    raw_v_adc_ch3	= { demuxed_ch3 * (5/4096) }
	raw_v_adc_ch4	= { demuxed_ch4 * (5/4096) }
	raw_v_adc_ch5	= { demuxed_ch5 * (5/4096) }
    raw_v_adc_ch6	= { demuxed_ch6 * (5/4096) }
    raw_v_adc_ch7	= { demuxed_ch7 * (5/4096) }

    raw_c_adc_ch0   = { raw_v_adc_ch0 * 239 }
    raw_c_adc_ch1   = { raw_v_adc_ch1 * 239 }
    raw_c_adc_ch2   = { raw_v_adc_ch2 * 239 }
