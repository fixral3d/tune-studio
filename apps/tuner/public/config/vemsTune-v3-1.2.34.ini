;	diffAmp= {100} ; experimental diff amplifier constant, to adjust scale
;	rdiff0 = {((totalperiod/rpmper0/nCylinders)-1)*diffAmp}
;	rdiff1 = {((totalperiod/rpmper1/nCylinders)-1)*diffAmp}
;	rdiff2 = {((totalperiod/rpmper2/nCylinders)-1)*diffAmp}
;	rdiff3 = {((totalperiod/rpmper3/nCylinders)-1)*diffAmp}
;	rdiff4 = {((totalperiod/rpmper4/nCylinders)-1)*diffAmp}
;	rdiff5 = {((totalperiod/rpmper5/nCylinders)-1)*diffAmp}
;	rdiff6 = {((totalperiod/rpmper6/nCylinders)-1)*diffAmp}
;	rdiff7 = {((totalperiod/rpmper7/nCylinders)-1)*diffAmp}

	rtest0 = { (rpmdiff0 * rpm / 5000) }
	rtest1 = { (rpmdiff1 * rpm / 5000) }
	rtest2 = { (rpmdiff2 * rpm / 5000) }
	rtest3 = { (rpmdiff3 * rpm / 5000) }
	rtest4 = { (rpmdiff4 * rpm / 5000) }
	rtest5 = { (rpmdiff5 * rpm / 5000) }
	rtest6 = { (rpmdiff6 * rpm / 5000) }
	rtest7 = { (rpmdiff7 * rpm / 5000) }

#if KNOCK_ALTERNATIVE

;	when using alternate rt data set apply safe defaults to 'stolen' variables
	rpmdiff0 = { rtdata == 1 ? -512 : rpmdiff0_raw }
	rpmdiff1 = { rtdata == 1 ? -512 : rpmdiff1_raw }
	rpmdiff2 = { rtdata == 1 ? -512 : rpmdiff2_raw }
	rpmdiff3 = { rtdata == 1 ? -512 : rpmdiff3_raw }
	rpmdiff4 = { rtdata == 1 ? -512 : rpmdiff4_raw }
	rpmdiff5 = { rtdata == 1 ? -512 : rpmdiff5_raw }
	rpmdiff6 = { rtdata == 1 ? -512 : rpmdiff6_raw }
	rpmdiff7 = { rtdata == 1 ? -512 : rpmdiff7_raw }

#if KNOCK_DEBUG
	raw_adc_ch5	= { rtdata == 1 ? -1000 : kraw_adc_ch5 }
	raw_adc_ch0	= { rtdata == 1 ? -1000 : kraw_adc_ch0 }
	raw_adc_ch1	= { rtdata == 1 ? -1000 : kraw_adc_ch1 }
	raw_adc_ch2	= { rtdata == 1 ? -1000 : kraw_adc_ch2 }
#endif

; 	knock values
    kcyl7 = { ( knockvalues >> 14 ) & 3 }
    kcyl6 = { ( knockvalues >> 12 ) & 3 }
    kcyl5 = { ( knockvalues >> 10 ) & 3 }
    kcyl4 = { ( knockvalues >> 8 ) & 3 }
    kcyl3 = { ( knockvalues >> 6 ) & 3 }
    kcyl2 = { ( knockvalues >> 4 ) & 3 }
    kcyl1 = { ( knockvalues >> 2 ) & 3 }
    kcyl0 = { ( knockvalues & 3 ) }

; 	calculated knock values using knock_pack 3 bit per cylinder value
	knockval7_calc =  { kcyl7 * worst_knockval / 3 }
	knockval6_calc =  { kcyl6 * worst_knockval / 3 }
	knockval5_calc =  { kcyl5 * worst_knockval / 3 }
	knockval4_calc =  { kcyl4 * worst_knockval / 3 }
    knockval3_calc =  { kcyl3 * worst_knockval / 3 }
    knockval2_calc =  { kcyl2 * worst_knockval / 3 }
    knockval1_calc =  { kcyl1 * worst_knockval / 3 }
    knockval0_calc =  { kcyl0 * worst_knockval / 3 }

; 	select between real knock data per cylinder or calculated
	knockval7 =  { rtdata == 1 ? rknock7 : knockval7_calc }
	knockval6 =  { rtdata == 1 ? rknock6 : knockval6_calc }
	knockval5 =  { rtdata == 1 ? rknock5 : knockval5_calc }
	knockval4 =  { rtdata == 1 ? rknock4 : knockval4_calc }
    knockval3 =  { rtdata == 1 ? rknock3 : knockval3_calc }
    knockval2 =  { rtdata == 1 ? rknock2 : knockval2_calc }
    knockval1 =  { rtdata == 1 ? rknock1 : knockval1_calc }
    knockval0 =  { rtdata == 1 ? rknock0 : knockval0_calc }

#if KNOCK_DEBUG
	knockadj7 = { rtdata == 1 ? radjust7 : -100 }
	knockadj6 = { rtdata == 1 ? radjust6 : -100 }
	knockadj5 = { rtdata == 1 ? radjust5 : -100 }
	knockadj4 = { rtdata == 1 ? radjust4 : -100 }
	knockadj3 = { rtdata == 1 ? radjust3 : -100 }
	knockadj2 = { rtdata == 1 ? radjust2 : -100 }
	knockadj1 = { rtdata == 1 ? radjust1 : -100 }
	knockadj0 = { rtdata == 1 ? radjust0 : -100 }
#endif

#else
	rpmdiff0 = { rpmdiff0_raw }
	rpmdiff1 = { rpmdiff1_raw }
	rpmdiff2 = { rpmdiff2_raw }
	rpmdiff3 = { rpmdiff3_raw }
	rpmdiff4 = { rpmdiff4_raw }
	rpmdiff5 = { rpmdiff5_raw }
	rpmdiff6 = { rpmdiff6_raw }
	rpmdiff7 = { rpmdiff7_raw }

	knockval7 =  { 0 }
	knockval6 =  { 0 }
	knockval5 =  { 0 }
	knockval4 =  { 0 }
    knockval3 =  { 0 }
    knockval2 =  { 0 }
    knockval1 =  { 0 }
    knockval0 =  { knock_cyl_0_knock_val }
	knockadj0 = { knock_cyl_0_adjust }
#endif

