name = BoostRefDC, "Boost Reference Dutycycle"

row = "functions",             "RT values",                   "RT values",         "", "sub values",           "",                        "calculations"
; gear/rpm refdc table
row = "Boost refDC table (RPM,GEAR)",        "${rpm} RPM",                   "${calc_gear_nd_or_speed}",  ":", "${disp_boostRefDc_curve} %",          " =",                        "${disp_boostRefDc1} %","note"
link  = 1, 0, BoostRefGearTable , ,{ ((boost_conf & 6) == 4 ) && !boost_more_targetref }
; single row RPM dependance
link  = 1, 0, boostRef , , { ((boost_conf & 6) == 0 ) && !boost_more_targetref } 
cell_text = 1,0,{ ((boost_conf & 6) == 0 ) && !boost_more_targetref } ,"Boost refDC curve (RPM)"
; single row SPEED dependance
link  = 1, 0, boostRefDCSpeed , ,  { ((boost_conf & 6) == 2 ) && !boost_more_targetref } 
cell_text = 1,0,{ ((boost_conf & 6) == 2 ) && !boost_more_targetref }  ,"Boost refDC curve (SPEED)"
; boosttarget/rpm refdc
link  = 1, 0, BoostRefTgtTable , ,  { boost_more_targetref } 
cell_text = 1,0,{ boost_more_targetref }  ,"Boost refDC table (RPM/BoostTgt)"

    row	= "Anytrim2 boost ref trim (add)",     "",                   "",         ":", "${disp_boostRefDc_anytrim2} %",   "+=",                       "${disp_boostRefDc1_1} %"
link  = 2, 0, anytrim_dlg , { !disp_boostrefdc_anytrim2_used }
link  = 2, 0, anytrim2_s_curve , { disp_boostrefdc_anytrim2_used }
line_enable = 2, { disp_boostrefdc_anytrim2_used }

   row	= "Anytrim4 boost ref trim (add)",     "",                   "",         ":", "${disp_boostRefDc_anytrim4} %",   "+=",                       "${disp_boostRefDc1_2} %"
link  = 3, 0, anytrim_dlg , { !disp_boostrefdc_anytrim4_used }
link  = 3, 0, anytrim4_s_curve , { disp_boostrefdc_anytrim4_used }
line_enable = 3, { disp_boostrefdc_anytrim4_used }


    row	= "Boost refDC MAT reduction (MAT)",     "${mat} C",                   "",         ":", "${disp_boostRefDc_mat_reduction} %",   "*=",                       "${disp_boostRefDc2} %"
link  = 4, 0, softrpm_dlg,boost_matdec

    row = "Boost refDC EGT reduction (EGT1)",    "${egt1} C",                  "",         ":", "${disp_boostRefDc_egt_reduction} %",   "*=",                       "${disp_boostRefDc3} %"
link  = 5, 0, softrpm_dlg ,boost_egtdec

    row	= "Boost refDC tps correction (TPS)",     "${throttle} %",              "",         ":", "${disp_boostRefDc_tps_scaling} %",     "*=",                       "${disp_boostRefDc4} %"
link  = 6, 0, BoostVsTpsCurve

    row = "VT refDC :",  "${disp_boostRefDc4} %",      "",     "",  "",                                     "",                                    ""
    row = "ECU refDC :", "${disp_boostRefDcE} %",      "note",     "",  "",                                     "",                                    ""
	help = 1, 7, "second value is either speed, gear or boost target"
	help = 8, 2, "the ecu does not send this value directly, boost dc equals refdc if p,i and d variables are 0"
	row = "Diff:",   "${disp_boostRefDc_diff} %",  "",         "",  "",                                     "",                                    ""

	col_format = 0, 0, LEFT
	col_format = 1, 0, RIGHT
	col_format = 2, 0, RIGHT
	col_format = 5, 0, RIGHT
	col_format = 7, 0, RIGHT

	disable_col = 5
