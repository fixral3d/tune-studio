
[TableEditor]
table = BoostRefGearTable,boostRefDCGearDepending,"Gear Dependent refDC Table"
	xBins = boostRpmBinsGear,  rpm
	yBins = boostGearBinAll,  gear
	zBins = boostRefDCGearDepending
	gridHeight = 1.2
	upDownLabel = ("More"), "(Less)"
	numberWidth = 3
	numberPrec = 0
	largeCellStep = 10
	smallCellStep = 1


