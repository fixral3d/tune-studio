[SuperCurve]
	supercurve = anytrim3_s_curve, "Anytrim 3 curve"
	
	curve = anytrim3_curve_clt_lambda, { (( anytrim3_raw & 31 ) == 22) && ((anytrim3_type_raw & 240) == 16) } 
	curve = anytrim3_curve_mat_lambda, { (( anytrim3_raw & 31 ) == 23) && ((anytrim3_type_raw & 240) == 16) } 
	curve = anytrim3_curve_tps_lambda, { (( anytrim3_raw & 31 ) == 24) && ((anytrim3_type_raw & 240) == 16) } 
	curve = anytrim3_curve_vbatt_lambda, { (( anytrim3_raw & 31 ) == 25) && ((anytrim3_type_raw & 240) == 16) } 
