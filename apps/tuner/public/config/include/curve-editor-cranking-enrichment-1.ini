
[SuperCurve]
	supercurve = CrankEnrich, "Cranking Enrichment curve"
	curve = CrankEnrich_low, { crank_enrich_max < 200 } 
	curve = CrankEnrich_mid, { crank_enrich_max < 600 } 
	curve = CrankEnrich_high, { crank_enrich_max > 600 } 
           
[CurveEditor]
   curve = CrankEnrich_low, "Cranking enrichment"
	columnLabel = "Coolant bins", "Enrichment"
	xAxis	    = -40, 155, 8, "%.0f"
	yAxis       = 100, 200, 11, "%.0f"
	xBins	    = cranking_coolant_range, coolant
	yBins	    = crank_enrich
	gauge	    = pulseWidthGauge

    xBinsSteps 	= 1, 5
	yBinsSteps	= 6.25, 31.25

[CurveEditor]
   curve = CrankEnrich_mid, "Cranking enrichment"
	columnLabel = "Coolant bins", "Enrichment"
	xAxis	    = -40, 155, 8, "%.0f"
	yAxis       = 100, 600, 11, "%.0f"
	xBins	    = cranking_coolant_range, coolant
	yBins	    = crank_enrich
	gauge	    = pulseWidthGauge

    xBinsSteps 	= 1, 5
	yBinsSteps	= 6.25, 31.25

[CurveEditor]
   curve = CrankEnrich_high, "Cranking enrichment"
	columnLabel = "Coolant bins", "Enrichment"
	xAxis	    = -40, 155, 8, "%.0f"
	yAxis       = 100, 1600, 11, "%.0f"
	xBins	    = cranking_coolant_range, coolant
	yBins	    = crank_enrich
	gauge	    = pulseWidthGauge

    xBinsSteps 	= 1, 5
	yBinsSteps	= 6.25, 31.25
