[HiddenOutputChannels]
	;Calculation Acceleration retard Angle
    calc_accelRetard_lookup= { ( (tpsDOT > tpsdotrate0) || ( accelEnrich > 0 ) ) ? (interpolate2d("tpsdotrate","accel_scale",tpsDOT) / 100) : 0}
    calc_accelRetard1 = {calc_accelRetard_lookup}

	calc_accelRetard_rpm= {interpolate2d("accel_rpm","tpsaq",rpm) / 100}
    calc_accelRetard2 = {calc_accelRetard1 * calc_accelRetard_rpm }

	calc_accelRetard_coolant_mult = { interpolate(60, 174, acmult, 100, coolant) / 100}
	calc_accelRetard3 = {calc_accelRetard2 * calc_accelRetard_coolant_mult}

    calc_accelRetard_coolant_offs = { ( (tpsDOT > tpsdotrate0) || ( accelEnrich > 0 ) ) ? interpolate(60 ,174 ,tpsacold ,0 , coolant) / 100 : 0}
	calc_accelRetard4= {calc_accelRetard3+calc_accelRetard_coolant_offs}

    calc_accelRetardK= { accell_retard }
    calc_accelRetard5= {calc_accelRetard4 * calc_accelRetardK}
    calc_accelRetard0= {calc_accelRetard5}
[OutputChannels]
    disp_accelRetard_lookup         = {calc_accelRetard_lookup * 100}
    disp_accelRetard1               = {calc_accelRetard1 * 100}
	dips_accelRetard_rpm            = {calc_accelRetard_rpm * 100}
    dips_accelRetard2               = {calc_accelRetard2 * 100}
	dips_accelRetard_coolant_mult   = {calc_accelRetard_coolant_mult * 100}
	dips_accelRetard3               = {calc_accelRetard3 * 100}
    dips_accelRetard_coolant_offs   = {calc_accelRetard_coolant_offs * 100}
	dips_accelRetard4               = {calc_accelRetard4 * 100}
	disp_accelRetardK               = {calc_accelRetardK}
    dips_accelRetard5               = {calc_accelRetard5}
    disp_accelRetard0               = {calc_accelRetard0}
 dips_accelRetardEnrich = {calc_accelRetard4 * req_fuel }
 [OutputChannels]
