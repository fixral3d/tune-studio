name = Spark
	row = "functions","RT values","RT values","","sub values ","","calculations "
	row = "Spark table (RPM,MAP)",       "${rpm} RPM",                       "${hybridmaptps} kPa",   ":", "${disp_spark_rpm_map} deg", "=",  "${disp_spark1_1} deg", ""
    link = 1, 0, sparkTbl , { 1 }
    line_enable = 1, { !ignlambdaYaxis }
	row = "Spark table (RPM,TPS)",       "${rpm} RPM",                       "${calc_kpa_tps_blend_tps}   %",   ":", "${calc_spark_rpm_tps} deg", "=",  "${disp_spark1_2} deg", ""
    link = 2, 0, sparkTblBlend , { 1 }
    line_enable = 2, { ignlambdaYaxis }
	row = "Launch retard",              "",                                 "",             ":", "${disp_spark_launch} deg",  "-=", "${disp_spark2} deg", ""
    link = 3, 0, launch_dlg
	row = "ALS retard (TPS,als_retard)", "${throttle} %",                  "${als_retard} deg",":", "${disp_spark_als} deg", "-=", "${disp_spark3} deg", "note"
    link = 4, 0, adv_als
    help = 4, 7, "als retard model can't calculate with Deactivation Time and EGT"

	row = "KNOCK retard",               "",                                 "",             ":", "${disp_spark_knock} deg",   "-=", "${disp_spark4} deg", ""
#if KNOCK_ALTERNATIVE
	link = 5, 0, knock1
#else	
    link = 5, 0, knockact
#endif	
	row = "IAC advance adjust(RPM,Tgt RPM)",     "${rpm} RPM",                 "${calc_iacTargetRpm} RPM",             ":", "${disp_spark_iac} deg",     "+=", "${disp_spark5} deg", ""
    link = 6,0, ignidlecontrol
	line_enable = 6, { iac_advance }
		
	row = "Mat retard (MAT,TPS)",        "${mat} C",                       "${throttle} %",  ":", "${disp_spark_mat} deg", "-=", "${disp_spark6} deg", ""
    link = 7, 0, matTpsRetardTbl , { 1 }
    line_enable = 7, { !matretard }
	row = "Acceleration retard",        "",                                 "",             ":", "${disp_spark_acc} deg",     "-=", "${disp_spark7} deg", ""
    link = 8, 0, accenrichment ; accell_retard
	row = "N2O retard",                 "",                                 "",             ":", "${disp_spark_n2o} deg",     "-=", "${disp_spark8} deg", ""
    link = 9, 0, n2o_setup ; n2o_retard
	
	row = "Anytrim3 spark trim",                 "",                                 "",             ":", "${disp_spark_anytrim3} deg",     "+=", "${disp_spark81} deg", ""
	link  = 10, 0, anytrim_dlg , { !disp_spark_anytrim3_used }
	link  = 10, 0, anytrim3_s_curve , { disp_spark_anytrim3_used }
	line_enable = 10, { disp_spark_anytrim3_used }
	
	row = "Anytrim5 spark trim",                 "",                                 "",             ":", "${disp_spark_anytrim5} deg",     "+=", "${disp_spark82} deg", ""
	link  = 11, 0, anytrim_dlg , { !disp_spark_anytrim5_used }
	link  = 11, 0, anytrim5_s_curve , { disp_spark_anytrim5_used }
	line_enable = 11, { disp_spark_anytrim5_used }
	
	row = "Gear or speed dependent retard",                 "",                                 "",             ":", "${disp_spark_fix_retard} deg",     "-=", "${disp_spark83} deg", ""
    link = 12, 0, fix_retard ;
	;
	row = "Cold adjust (CLT,MAP)",   "${coolant} C",                   "${map} kPa",   ":", "${disp_spark_cold} deg",    "+=", "${disp_spark9} deg", ""
    link = 13, 0, cltignadjTbl_TPS, { alphan } ; tps
	link = 13, 0, cltignadjTbl_MAP, { !alphan } ; map
	cell_text = 13,0,{ alphan },"Cold adjust (CLT,TPS)"

	row = "Cranking (RPM)",              "${rpm} RPM",                       "",             ":", "${disp_spark_crank} deg",   "=",  "${disp_spark10} deg", ""
    link = 14, 0, startup
	row = "Shift Cut retard",           "",                                 "",             ":", "${disp_spark_shiftcut} deg","=",  "${disp_spark11} deg", ""
    link = 15, 0, shiftcut ; shiftcut_retard
	row = "Ignition retard clamp",            "",                                 "",             ":", "${disp_spark_clamp} deg",   "=",  "${disp_spark12} deg", ""
    link = 16, 0, ignition
	row = "VT Spark Advance:",         "${disp_spark12} deg",                     "",             "", "", "", ""
	row = "ECU Spark Advance:",         "${spark} deg",                     "",             "", "", "", ""
    row = "Diff:",                      "${disp_spark_dif} deg",            "",             "", "", "", ""

	col_format = 0, 0, LEFT
	col_format = 1, 0, RIGHT
	cell_format = 6, 2, 0, RIGHT
	cell_format = 4, 1, 1, RIGHT
	cell_format = 17, 1, 1, RIGHT
	cell_format = 18, 1, 1, RIGHT
	disable_col = 6

