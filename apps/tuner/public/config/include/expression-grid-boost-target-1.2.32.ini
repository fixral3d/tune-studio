cell_text = 2,5,{disp_boostTarget_anytrim2_mult},"*="

  row	= "Anytrim4 boost tgt trim (add)",          "",  "",         ":", "${disp_boostTarget_anytrim4_sub} ",    "+=",                       "${disp_boostTarget1_e} kPa"
