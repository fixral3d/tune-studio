	row = "Lambda table (RPM,TPS)",       "${rpm} RPM",                       "${calc_kpa_tps_blend_tps}   %",   ":", "${disp_lambdaTarget_rpm_tps} ", "=",  "${disp_lambdaTarget2} ", ""
