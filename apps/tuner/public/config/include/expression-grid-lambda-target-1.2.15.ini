	row = "Anytrim2 lambda trim",                "",  "",         ":", "${disp_lambdaTarget_anytrim2}  %",   "*=", "${disp_lambdaTarget6} ", ""
	link  = 6, 0, anytrim_dlg , { !disp_lambdaTarget_anytrim2_used }
	link  = 6, 0, anytrim2_s_curve , { disp_lambdaTarget_anytrim2_used }
	line_enable = 6, { disp_lambdaTarget_anytrim2_enabled }
	
	row = "Anytrim3 lambda trim",                "",  "",         ":", "${disp_lambdaTarget_anytrim3}  %",   "*=", "${disp_lambdaTarget7} ", ""
	link  = 7, 0, anytrim_dlg , { !disp_lambdaTarget_anytrim3_used }
	link  = 7, 0, anytrim3_s_curve , { disp_lambdaTarget_anytrim3_used }
