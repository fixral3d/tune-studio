;	since 1.2.20 realtime data is available for this variable. - DB
	calc_iacTargetRpm  = { iacTargetRpm }
    calc_iacRpmDif = { ( calc_iacTargetRpm - rpm ) }

    calc_isCranking         = {isCranking}
    calc_isAfterStart       = {isAfterStart}
    calc_launch_active      = {isLaunch }
    calc_notRunning      = { rpm < 10 ? 1 : 0 }
	calc_launch_retard_enrich_active = { calc_launch_active }
    calc_als_active         = {isALSActive }
    calc_n2o_active         = {isN2OActive }

    calc_is_fuelcut = { isShiftCut || fuelcut_max_kpa < map }
#if ALS
    calc_active_rev_limit = { (calc_als_active) ? als_rev_limit : rev_limit }
#else
    calc_active_rev_limit = { rev_limit }
#endif

    calc_is_active_rev_limit = { rpm > calc_active_rev_limit }
#if ALS
    calc_is_tps_overrun = { (!calc_als_active) && 0 } ; ...
#else
    calc_is_tps_overrun = { 0 } ; ...
#endif
    calc_is_flood_clear = { !( rpm > cranking_thres ) && !( throttle < 70) }
	
	; since aug 22 we have als_active realtime config bit, new conditions below
	als_retard_active = {isALsFuncActive && (rpm > als_retard_rpm1 && throttle < als_retard_maxtps) && (calc_spark_als2_Y1 != 0) }
	als_cut_active = {isALsFuncActive && (rpm > als_igncut_rpm1 && throttle < als_cut_maxtps) && als_max_cut != 0 }
	
	; launchtime, time since last launch input activation, better check last function active (most racecars use always active input) - fix later - DB
	; i want to make a latch but no idea how, any ideas ? function like line below:
	; calc_launchtime_last_active = { isLaunch ? time : calc_launchtime_last_active }
	; calc_launchtime_last_active = { (isLaunch && isLaunch[-1] == 0) ? time : calc_launchtime_last_active[-1] }
	
	; calc_launchtime_prev = calc_launchtime_last_active[-1]
	; calc_launchtime_last_active = { (!isLaunch_input_active_calc && isLaunch_input_active_calc[-1]) ? 0 : 1 }
	
	; somehow it is impossible todo calc with buildin function time, ideas ? 
	calc_launchtime = { 0 }
	
	; pps_raw not logged in 1.2.15 and up alt_knock branch, but we can calculate
	; throttletarget = {(100/255) * pps_raw}
	
	; throttle target calculation with iac target mixing and table switch based on als_active
	calc_pps_target =  { interpolate3d("etc_target_rpmbins","etc_target_ppsbins","etc_target",rpm,pps1) }
	calc_pps_target_als = { interpolate3d("etc_target_rpmbins","etc_target_ppsbins","etc_als_target",rpm,pps1) }
	calc_pps_active_target = { isALsFuncActive ? calc_pps_target_als : calc_pps_target }
	calc_pps_iac_feedback = { ((iac2etctarget_raw * iacPos) / 1024) }
	calc_pps_total_target = { calc_pps_active_target + (calc_pps_iac_feedback * (100/255)) }
	calc_throttletarget = { calc_pps_total_target > 100 ? 100 : calc_pps_total_target }
	
	calc_etc_error = { calc_throttletarget - throttle }
	calc_etc_abs_error = { (calc_etc_error > 0) ? calc_etc_error : (calc_etc_error * -1) }
	
	analog_input_0_flag 		= { raw_adc_ch0 > 2048 ? 1 : 0 }
	;analog_input_0_inverted_flag 	= { raw_adc_ch0 < 2048 ? 1 : 0 }
	analog_input_1_flag 		= { raw_adc_ch1 > 2048 ? 1 : 0 }
	analog_input_1_inverted_flag 	= { raw_adc_ch1 < 2048 ? 1 : 0 }
	analog_input_2_flag 		= { raw_adc_ch2 > 2048 ? 1 : 0 }
	analog_input_2_inverted_flag 	= { raw_adc_ch2 < 2048 ? 1 : 0 }
	analog_input_3_flag 		= { raw_adc_ch3 > 2048 ? 1 : 0 }
	analog_input_3_inverted_flag 	= { raw_adc_ch3 < 2048 ? 1 : 0 }
	analog_input_4_flag 		= { raw_adc_ch4 > 2048 ? 1 : 0 }
	;analog_input_4_inverted_flag 	= { raw_adc_ch4 < 2048 ? 1 : 0 }
	analog_input_5_flag 		= { raw_adc_ch5 > 2048 ? 1 : 0 }
	analog_input_5_inverted_flag 	= { raw_adc_ch5 < 2048 ? 1 : 0 }
	analog_input_6_flag 		= { raw_adc_ch6 > 2048 ? 1 : 0 }
	analog_input_6_inverted_flag 	= { raw_adc_ch6 < 2048 ? 1 : 0 }
	analog_input_7_flag 		= { raw_adc_ch7 > 2048 ? 1 : 0 }
	analog_input_7_inverted_flag 	= { raw_adc_ch7 < 2048 ? 1 : 0 }

	calc_anytrim1_mcp_val = { switchCase8( ( anytrim1_source & 7 ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7 ) / 4096 *5000 }
	calc_anytrim1_fpr_val = { (( calc_anytrim1_mcp_val / 1000 -0.04 ) / 0.006429 ) - map }
	calc_anytrim2_mcp_val = { switchCase8( ( anytrim2_source & 7 ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7 ) / 4096 *5000  }
	calc_anytrim2_fpr_val = { (( calc_anytrim2_mcp_val / 1000 -0.04 ) / 0.006429 ) - map }
	calc_anytrim3_mcp_val = { switchCase8( ( anytrim3_source & 7 ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7 ) / 4096 *5000  }
	calc_anytrim3_fpr_val = { (( calc_anytrim3_mcp_val / 1000 -0.04 ) / 0.006429 ) - map }
	calc_anytrim4_mcp_val = { switchCase8( ( anytrim4_source & 7 ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7 ) / 4096 *5000  }
	calc_anytrim4_fpr_val = { (( calc_anytrim4_mcp_val / 1000 -0.04 ) / 0.006429 ) - map }
	calc_anytrim5_mcp_val = { switchCase8( ( anytrim5_source & 7 ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7 ) / 4096 *5000  }
	calc_anytrim5_fpr_val = { (( calc_anytrim5_mcp_val / 1000 -0.04 ) / 0.006429 ) - map }

	crank_enrich_max2 = {crank_enrich2 > crank_enrich3 ? crank_enrich2 : crank_enrich3}
	crank_enrich_max1 = {crank_enrich1 > crank_enrich_max2 ? crank_enrich1 : crank_enrich_max2}
	crank_enrich_max = {crank_enrich0 > crank_enrich_max1 ? crank_enrich0 : crank_enrich_max1}

	afterstart_enrich_max2 = {afterstart_enrich2 > afterstart_enrich3 ? afterstart_enrich2 : afterstart_enrich3}
	afterstart_enrich_max1 = {afterstart_enrich1 > afterstart_enrich_max2 ? afterstart_enrich1 : afterstart_enrich_max2}
	afterstart_enrich_max = {afterstart_enrich0 > afterstart_enrich_max1 ? afterstart_enrich0 : afterstart_enrich_max1}

	calc_cam_target_MAP = { interpolate3d("camshaft_BinsRpm","camshaft_BinsMap","camshaft_angle1_table",rpm,map) }
	calc_cam_targetE_MAP = { interpolate3d("camshaft_BinsRpm","camshaft_BinsMap","camshaft_angle2_table",rpm,map) }
	calc_cam_target_TPS = { interpolate3d("camshaft_BinsRpm","camshaft_BinsTps","camshaft_angle1_table",rpm,calc_kpa_tps_blend_tps) }
	calc_cam_targetE_TPS = { interpolate3d("camshaft_BinsRpm","camshaft_BinsTps","camshaft_angle2_table",rpm,calc_kpa_tps_blend_tps) }
	calc_cam_target = {  calc_is_alphan ? calc_cam_target_TPS : calc_cam_target_MAP }
	calc_cam_targetE = {  calc_is_alphan ? calc_cam_targetE_TPS : calc_cam_targetE_MAP }
	
	calc_cam_target_diff = { sectrig_angle_inlet - calc_cam_target }
	calc_cam_target_diffE = { extrig_angle - calc_cam_targetE }
	
; 	knock table val lookup
;
; 	2-d table lookup
;	knock_table_val = { (interpolate2d("rpmBinsK","knockTable",rpm) ) }
;
;   now back to 8x4 3-d table lookup
	calc_knock_table_val_TPS = { (interpolate3d("rpmBinsK","tpsBinsK","knockTable",rpm,calc_kpa_tps_blend_tps) ) }
	calc_knock_table_val_MAP = { (interpolate3d("rpmBinsK","mapBinsK","knockTable",rpm,map) ) }
	calc_knock_table_val = { calc_is_alphan ? calc_knock_table_val_TPS : calc_knock_table_val_MAP }

	isSoftCutActive = { ( rpm > softrpm_rpm ) ? 2 : 0 }
	isRevLimitActive = { ( rpm > rev_limit ) ? 1 : 0 }
	RevLimitState = { isSoftCutActive + isRevLimitActive }

	calc_TransB_mcp_val1 = { switchCase8( ( transb_input_raw & 7 ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7 ) / 4096 *5000 }
	calc_TransB_mcp_val = { (transb_input_raw & 8) ? (5000-calc_TransB_mcp_val1) : calc_TransB_mcp_val1 }
	isTransBrakeActive = { ( ( (transb_channel & 8) == 0 ) && ( calc_TransB_mcp_val < 1250 ) )  ? 1 : 0 }

	; axis used by VE table.
	; rescale iac2load back to internal unit to use internal way of calc - DB
	calc_kpa_tps_blend3 = { ( iacPos * (iac2load * 20.56471)) >> 10 }
	calc_kpa_tps_blend2 = { tpsADC*2 + ( ((iac_conf & 8 ) == 8) ? calc_kpa_tps_blend3 : 0)}
	calc_kpa_tps_blend1 = { ( calc_kpa_tps_blend2 > 510 ) ? 510 : calc_kpa_tps_blend2 }
	
	; tps axis with iac compensation rescaled for percentage display
	calc_kpa_tps_blend_tps  = { calc_kpa_tps_blend1 / 510 * 100 }
	calc_is_alphan = { ((config13 & 4) == 4) }

	speed1S2_1 = { speed - speed2 }
	speed1S2_2 = { ( speed1S2_1 >= 128 ) ? 128 : speed1S2_1 }
	speed1S2 = { ( speed1S2_2 <= -128 ) ? -128 : speed1S2_2 }

	speed1M2_scaler = { (speed < 16) ? (speed) : 16 }
	speed1M2_3 = { speed / speed2 }
	speed1M2_2_plus = { ( (speed1M2_3 - 1 ) * speed1M2_scaler / 16 ) + 1 }
	speed1M2_2_minus = { 1 - ( (1 - speed1M2_3 ) * speed1M2_scaler / 16 )  }
	speed1M2_1 = { (speed1M2_3 >= 1 ) ? speed1M2_2_plus : speed1M2_2_minus}
	speed1M2 = { (speed1M2_1 > 2) ? 2 : speed1M2_1 }

; 	anytrim section linked to firmware 1.2.17 if anything changes update this - start - DB
	calc_AdjustableFuelCutRpm_anytrim_special_launchtime_tps50 = { (throttle >= 50) ? interpolate2d("calc_anytrim_bin_launch_tps","anytrim3_softcut_array",calc_launchtime) : 0 }
    calc_AdjustableFuelCutRpm_anytrim_special_launchtime = { interpolate2d("calc_anytrim_bin_launch","anytrim3_softcut_array",calc_launchtime) }
	calc_AdjustableFuelCutRpm_anytrim_special_speed1M2 = { interpolate2d("calc_anytrim_bin_speedM","anytrim3_softcut_array",speed1M2) }
    calc_AdjustableFuelCutRpm_anytrim_special_speed1S2 = { interpolate2d("calc_anytrim_bin_speedS","anytrim3_softcut_array",speed1S2) }
    calc_AdjustableFuelCutRpm_anytrim_special_speed2 = { interpolate2d("calc_anytrim_bin_speed","anytrim3_softcut_array",speed2) }
    calc_AdjustableFuelCutRpm_anytrim_special_speed1 = { interpolate2d("calc_anytrim_bin_speed","anytrim3_softcut_array",speed) }
    calc_AdjustableFuelCutRpm_anytrim_traditional_mcp = { interpolate2d("calc_anytrim_bin_mcp","anytrim3_softcut_array",calc_anytrim3_mcp_val) }
    calc_AdjustableFuelCutRpm_anytrim_traditional_fpr = { interpolate2d("calc_anytrim_bin_fpr","anytrim3_softcut_array",calc_anytrim3_fpr_val) }
    calc_AdjustableFuelCutRpm_anytrim_traditional_map = { interpolate2d("calc_anytrim_bin_map","anytrim3_softcut_array",map) }
    calc_AdjustableFuelCutRpm_anytrim_traditional_mcp_or_fpr = { (anytrim3_raw > 8) ? calc_AdjustableFuelCutRpm_anytrim_traditional_fpr : calc_AdjustableFuelCutRpm_anytrim_traditional_mcp}
	calc_AdjustableFuelCutRpm_anytrim_special5 = { ( anytrim3_raw == 21 ) ? calc_AdjustableFuelCutRpm_anytrim_special_launchtime_tps50 : 0 }
    calc_AdjustableFuelCutRpm_anytrim_special4 = { ( anytrim3_raw == 20 ) ? calc_AdjustableFuelCutRpm_anytrim_special_launchtime : calc_AdjustableFuelCutRpm_anytrim_special5 }
	calc_AdjustableFuelCutRpm_anytrim_special3 = { ( anytrim3_raw == 19 ) ? calc_AdjustableFuelCutRpm_anytrim_special_speed1M2 : calc_AdjustableFuelCutRpm_anytrim_special4 }
    calc_AdjustableFuelCutRpm_anytrim_special2 = { ( anytrim3_raw == 18 ) ? calc_AdjustableFuelCutRpm_anytrim_special_speed1S2 : calc_AdjustableFuelCutRpm_anytrim_special3 }
    calc_AdjustableFuelCutRpm_anytrim_special1 = { ( anytrim3_raw == 17 ) ? calc_AdjustableFuelCutRpm_anytrim_special_speed2 : calc_AdjustableFuelCutRpm_anytrim_special2 }
    calc_AdjustableFuelCutRpm_anytrim_special = { ( anytrim3_raw == 16 ) ? calc_AdjustableFuelCutRpm_anytrim_special_speed1 : calc_AdjustableFuelCutRpm_anytrim_special1 }
    calc_AdjustableFuelCutRpm_anytrim_traditional = { (anytrim3_raw == 8) ?  calc_AdjustableFuelCutRpm_anytrim_traditional_map : calc_AdjustableFuelCutRpm_anytrim_traditional_mcp_or_fpr}
    calc_AdjustableFuelCutRpm_anytrim1 = { ( anytrim3_raw > 15 ) ? calc_AdjustableFuelCutRpm_anytrim_special : calc_AdjustableFuelCutRpm_anytrim_traditional }
	
	; apply end result
    calc_AdjustableFuelCutRpm_anytrim = { ((anytrim3_type_raw & 240) == 144 ) ? calc_AdjustableFuelCutRpm_anytrim1 : 0 }
; 	eof anytrim section linked to firmware 1.2.17 if anything changes update this - end - DB	
	
	calc_AdjustableFuelCutRpm2 = { rpm - calc_AdjustableFuelCutRpm_anytrim }
	calc_AdjustableFuelCutRpm1 = { (calc_AdjustableFuelCutRpm2 > 16320 ) ? 16320 : calc_AdjustableFuelCutRpm2}
	calc_AdjustableFuelCutRpm = { (calc_AdjustableFuelCutRpm1 < 0 ) ? 0 : calc_AdjustableFuelCutRpm1}

	isAdjustableFuelCutActive = { ( (calc_AdjustableFuelCutRpm > softcut_rpm1 ) || ( calc_AdjustableFuelCutRpm > softcut_rpm2 ) ) && ( partialfuelcut !=0 ) }
	isAdjustableFuelCutLowActive = { ((calc_AdjustableFuelCutRpm > softcut_rpm1 ) && ( partialfuelcut !=0 ) ) }
	isAdjustableFuelCutHighActive = { (( calc_AdjustableFuelCutRpm > softcut_rpm2 ) && ( partialfuelcut !=0 )) }
	PartialFuelCutState = { isAdjustableFuelCutHighActive ? 3 : isAdjustableFuelCutLowActive ? 2 : ( partialfuelcut !=0 ) }

	;isAudiHallScopeActive = { 255 - ( ( calc_is_auditrigger || calc_is_auditrigger_div_byN ) && ((secondary_trigger & 128 ) == 128 )) *216 +( rpm*0) };255 to disable or 39 to enable
	isAudiHallScopeActive = { ( ( calc_is_auditrigger || calc_is_auditrigger_div_byN ) && (secondary_trigger & 128 ) ) ? 39 : 255 }

	;under development
	boost_integral_effect = { boost_pid_ki * (boost_integral - 128)  / 32 }

	;boost_tgt		= scalar, U08, 48, "kPa",	4.000, 0.000
	;map			= { mapADC / 4 }
	;mapRel		= { map - boost_tgt}
	;boost_P_effect = { (MAP - boost_target_raw*16) * boost_pid_kp / 8 }
	boost_P_effect = { (map - boost_tgt * 16) * boost_pid_kp / 8 }

	; calculate iac active I effect (in steps or raw duty)	
	iac_integral_effect_noasym = { (iac_type == 2 || iac_type == 3) ? ( (iac_ki * iac_integral_signed) / 32 ) : 0}
	iac_integral_effect2 = { iac_integral_effect_noasym }
	
	; no idle bit dependance for integral effect, we are using the real iac_integral_signed from v3 which is updated accordingly
	iac_integral_effect = { iac_integral_effect2 }
	
	; take care calculated error does not include afterstart, needs fix - DB
	iac_P_error = { calc_iacRpmDif }
	
	; iac pid assymetric scaleup constants
	iac_P_error_smallscale = { 16 + iac_P_error }
	iac_P_error_bigscale = { 64 }
	iac_P_asym_scale = { (iac_P_error < 48) ? iac_P_error_smallscale : iac_P_error_bigscale }
	
	; calculate iac asym scaled-up error for under target
	iac_P_error_assym_active2 = { (iac_P_error * iac_P_asym_scale) / 16 }
	iac_P_error_assym_active1 = { (iac_P_error_assym_active2 >= 8000) ? 32767 : iac_P_error_assym_active2 }
	iac_P_error_assym_active = { (iac_P_error > 0) ? iac_P_error_assym_active1 : iac_P_error }

	; calculate iac active P effect (in steps or raw duty)
	iac_P_effect_noasym = { (iac_type == 2 || iac_type == 3) ? ( (iac_kp * iac_P_error) / 4096 ) : 0 }
	iac_P_effect_asym = { (iac_type == 2 || iac_type == 3) ? ( (iac_kp * iac_P_error_assym_active) / 4096 ) : 0 }
	iac_P_effect2 = { iac_pid_conf_asym ? iac_P_effect_asym : iac_P_effect_noasym }
	
	; only apply P when we are actually in idle mode
	iac_P_effect = { isIAC ? iac_P_effect2 : 0 }
	
	; if calculations above are correct D effect should be the difference (iacPos - calc), keep in mind iacPos is railed between iac_minpwm_stepper/iac_max_steps not accounted for
	iac_D_effect2 = { (iac_type == 2 || iac_type == 3) ? iacPos - ( iac_P_effect + iac_integral_effect + iac_refPos ) : 0 }
	
	; only apply D when we are actually in idle mode
	iac_D_effect = { isIAC ? iac_D_effect2 : 0 }
	
	; calculate reference position (does not take iac close delay into account)
	iac_refPos_cranking = { interpolate(-40, 77, iac_cold_start_pos, iac_warm_start_pos, coolant) }
	iac_refPos_running = {  interpolate2d("warmup_clt_bins","iac_ref_pos",coolant) }
	iac_refPos2 = { (iac_type == 2 || iac_type == 3) ? ((calc_notRunning || calc_isCranking) ? iac_refPos_cranking : iac_refPos_running) : 0 }
	
	; timeout cranking condition for PWM type iac control
	iac_refPos = { (iac_type == 2 && !isFuelPump) ? 0: iac_refPos2 }
	
	; channels for iac pid action logging
	; setpoint = calc_iacTargetRpm (no afterstart_added_rpm)
	; pv = rpm
	; 
	; rest below
	iac_refPos_P = { iac_refPos + iac_P_effect }
	iac_refPos_I = { iac_refPos + iac_integral_effect }
	iac_refPos_PI = { iac_refPos + iac_P_effect + iac_integral_effect }
	iac_refPos_PD = { iac_refPos + iac_P_effect + iac_D_effect }
	iac_refPos_PID = { iac_refPos + iac_P_effect + iac_integral_effect + iac_D_effect }
	
