[SuperCurve]
	supercurve = AfterStartEnrich, "Afterstart Enrichment curve"
	curve = AfterStartEnrich_low, { afterstart_enrich_max < 200 } 
	curve = AfterStartEnrich_mid, { afterstart_enrich_max < 600 } 
	curve = AfterStartEnrich_high, { afterstart_enrich_max > 600 } 


[CurveEditor]
   curve = AfterStartEnrich_low, "AfterStart enrichment"
	columnLabel = "Coolant bins", "Enrichment"
	xAxis	    = -40, 155, 8, "%.0f"
	yAxis       = 100, 200, 11, "%.0f"
	xBins	    = cranking_coolant_range, coolant
	yBins	    = afterstart_enrich
	gauge	    = pulseWidthGauge

    xBinsSteps 	= 1, 5
	yBinsSteps	= 6.25, 31.25

[CurveEditor]
   curve = AfterStartEnrich_mid, "AfterStart enrichment"
	columnLabel = "Coolant bins", "Enrichment"
	xAxis	    = -40, 155, 8, "%.0f"
	yAxis       = 100, 600, 11, "%.0f"
	xBins	    = cranking_coolant_range, coolant
	yBins	    = afterstart_enrich
	gauge	    = pulseWidthGauge

    xBinsSteps 	= 1, 5
	yBinsSteps	= 6.25, 31.25

[CurveEditor]
   curve = AfterStartEnrich_high, "AfterStart enrichment"
	columnLabel = "Coolant bins", "Enrichment"
	xAxis	    = -40, 155, 8, "%.0f"
	yAxis       = 100, 1600, 11, "%.0f"
	xBins	    = cranking_coolant_range, coolant
	yBins	    = afterstart_enrich
	gauge	    = pulseWidthGauge

    xBinsSteps 	= 1, 5
	yBinsSteps	= 6.25, 31.25

