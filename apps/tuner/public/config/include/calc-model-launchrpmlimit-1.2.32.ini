[HiddenOutputChannels]
	;Calculation for launch flag  (states)
#if PS2KEYBOARD
	isLaunch_speed_depend_active_calc = { ( (launchcurve_disable_raw == 0 ) || ( roadSpeed_show <= launchcurve_kph_bin0 ) ) ? 0 : 1 }
#else
	calc_launch_roadSpeed = { ((iac_conf2 & 32 ) == 32 ) ? speed2 : roadSpeed }
	isLaunch_speed_depend_active_calc = { ( (launchcurve_disable_raw == 0 ) || ( calc_launch_roadSpeed <= launchcurve_kph_bin0 ) ) ? 0 : 1 }
#endif
	calc_Launch_input_value4 = { switchCase8( (als_launch_input & 7) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7 ) }
	calc_Launch_input_value3 = { (als_launch_input & 8 ) == 8 ? 4096-calc_Launch_input_value4 : calc_Launch_input_value4 }
	calc_Launch_input_value2 = { (als_launch_input & 15 ) == 8 ? 0 : calc_Launch_input_value3 }
	calc_Launch_input_value1 = { (als_launch_input & 15 ) == 12 ? 4096 : calc_Launch_input_value2 }
	calc_Launch_input_value = { (als_launch_input & 15 ) == 15 ? 4096 : calc_Launch_input_value1 }

; 	since xxx ? higher than 1.56 to deactivate, lower than 0.9v to activate, midway in between
; 	no idea how to model the hysteresys without internal (VemsTune storage) TODO - DB
	isLaunch_input_active_calc = { calc_Launch_input_value < 737 ? 1 : 0 }
; 	was : higher than 2.5v theshold for deactivate, lower than 1.25v to activate, midway in between.
;	isLaunch_input_active_calc = { calc_Launch_input_value < 2048 ? 1 : 0 }
;
	isLaunch_retard_active_calc = { isLaunch_speed_depend_active_calc == 0 && calc_spark_launch > 0 }
	isLaunch_enrich_active_calc = { isLaunch_speed_depend_active_calc == 0 && calc_gammaEnrichment_launch > 1 }

	isLaunch_cut_calc = { calc_launch_active && als_igncut > 0 && rpm > calc_launchRpmTarget3}

	flag_calculatedLaunch1 = { 1 + ( 2 * isLaunch_enrich_active_calc ) + ( 4 * isLaunch_retard_active_calc ) + ( 8 * isLaunch_cut_calc ) + ( 16 * isLaunch_speed_depend_active_calc ) }
#if PS2KEYBOARD
	isLaunchCalc = { calc_launch_active ? flag_calculatedLaunch1 : 0 }
#else
;	isLaunchCalc = { isLaunch_input_active_calc ? flag_calculatedLaunch1 : 0 }
	isLaunchCalc = { calc_launch_active ? flag_calculatedLaunch1 : 0 }
#endif

	;Calculation Launch rpm limit
	calc_launchRpmTarget_fix = { launch_rpm }
    calc_launchRpmTarget1 = { calc_launchRpmTarget_fix }

#if PS2KEYBOARD
	calc_launchRpmTarget_speed  =  {interpolate2d ("roadSpeed_vs_RPM_X","roadSpeed_vs_RPM_Y",roadSpeed_show)}
	calc_launchRpmTarget_time = { roadSpeed_show / 16 }
    calc_launchRpmTarget2 = { (isLaunch_speed_depend_active_calc ) ? calc_launchRpmTarget_speed : calc_launchRpmTarget1 }
#else
	calc_launchRpmTarget_speed  =  {interpolate2d ("roadSpeed_vs_RPM_X","roadSpeed_vs_RPM_Y",roadSpeed)}
    calc_launchRpmTarget2 = { isLaunch_speed_depend_active_calc ? calc_launchRpmTarget_speed : calc_launchRpmTarget1 }
#endif

