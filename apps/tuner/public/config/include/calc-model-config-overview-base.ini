	;Calculation for config overview group
;Ecu basic setup
	disp_overview_ibutton = { ((prohibit_config_raw  & 128) > 0 )+1 }
#if PS2KEYBOARD
       	calc_overview_prohibit_16bit= { (1 << 15 ) | ( (fw_major & 7 ) << 10) | ( (fw_minor & 7 ) << 7 ) | ( fw_build & 127 ) }
#else
       	calc_overview_prohibit_16bit= { ( (fw_major & 7 ) << 10) | ( (fw_minor & 7 ) << 7 ) | ( fw_build & 127 ) }
#endif
	calc_overview_prohibit_h= { calc_overview_prohibit_16bit >> 8 }
	calc_overview_prohibit_l= { calc_overview_prohibit_16bit & 255 }

	disp_overview_prohibit_check3 = { ((190 - prohibit_h ) | ( 239 - prohibit_l)) ? 0 : 1 }
	disp_overview_prohibit_check2 = { ((calc_overview_prohibit_h - prohibit_h) | ( calc_overview_prohibit_l - prohibit_l)) ? 3 : 1 }
	disp_overview_prohibit_check1 = { disp_overview_prohibit_check3 ? 2 : disp_overview_prohibit_check2 }
	disp_overview_prohibit_check01 = { ( (prohibit_h < -1000 ) || ( prohibit_h >1000 )) ? 0 : disp_overview_prohibit_check1 }
	disp_overview_prohibit_check = { ( disp_overview_ibutton == 2 ) ? -1 : disp_overview_prohibit_check01 }   ; Fail:3,Not used:-1, Ok:1, not supported:0

	disp_overview_passwd = { ( pw_comm_lock0 == 222 ) +1}
        disp_overview_confsw = { ( (config_switch_raw & 248) > 0 ) +1}


	calc_overview_gpslog3 = { ((prohibit_config_raw & 128) == 128 ) ? 4 : 5 }
	calc_overview_gpslog2 = { ((gps_log_raw & 128 ) == 128 ) ? 3 : calc_overview_gpslog3 }
	calc_overview_gpslog1 = { ((config12 & 2) == 2) ? calc_overview_gpslog2 : 2 }
	calc_overview_gpslog = { (knock_chan == 241) ? calc_overview_gpslog1 : 1 }
        disp_overview_gpslog = { calc_overview_gpslog }

;Engine basic setup
	disp_over_engine_nr_cyl = { ( config11 >> 4 ) + 1 } 
	disp_over_engine_ign_out = { ( ignchmaxscalar & 7 ) + 1 }
	disp_over_engine_ign_dual = { ( ign_out & 2 ) / 2 };ign_out_dual
	disp_over_engine_inj_out = { ( alternate & 7 ) + 1 }
	calc_over_engine_inj_stag_nr = { (disp_over_engine_inj_out > 7) ? 0 : ((disp_over_engine_inj_out > 6) ? 1 : ((disp_over_engine_inj_out > 4) ? 2 : disp_over_engine_inj_out ) ) }
#if HIGHBOOST
	disp_over_engine_inj_stag = {  (( inj_stage2_start_tps < 99 ) || ( inj_stage2_start_map < 510 )  ) ?  calc_over_engine_inj_stag_nr : 0};if staging 1234221
#else
	disp_over_engine_inj_stag = {  (( inj_stage2_start_tps < 99 ) || ( inj_stage2_start_map < 255 )  ) ?  calc_over_engine_inj_stag_nr : 0};if staging 1234221
#endif
	disp_over_engine_rev_map = { fuelcut_max_kpa }
	disp_over_engine_rev = { rev_limit }
	disp_over_engine_softcut = { softrpm_rpm }	

;Trigger setup
	calc_is_extrapulse_trigger = { ( strig_validation_raw & 8 ) == 8 }
	calc_specialtrigger_type = { ( primary_trigger & 224 ) || calc_is_extrapulse_trigger }
	calc_not_specialtrigger = { calc_specialtrigger_type == 0 } 
	calc_is_coil = { (( primary_trigger & 2 ) == 2 ) && calc_not_specialtrigger}
	calc_ismissing = { (( primary_trigger & 2 ) == 0 ) && calc_not_specialtrigger}
	calc_isN_1 = { calc_ismissing && ( ( primary_trigger & 16 ) == 16 ) }
	calc_isN_2 = { calc_ismissing && ( ( primary_trigger & 16 ) == 0  ) }
        calc_is_sectrig_subaru_special = { ( secondary_trigger & 64 ) == 64}
	
	calc_is_fiatstilosubaru = { ( primary_trigger & 161 ) == 161 }
	calc_is_fiatstilo = { ( another_trigger_tooth < 3 ) && calc_is_fiatstilosubaru } 
	calc_is_subaru6_7 = { ( another_trigger_tooth > 2 ) && calc_is_fiatstilosubaru } 
	calc_is_subaru_32_2_2_2 = { ( tooth_wheel > 12 ) && calc_is_fiatstilosubaru }
	calc_is_suzuki_32_2_2_2 = { ( ( strig_validation_raw & 16 ) == 16  ) && calc_is_fiatstilosubaru }
	calc_iselise = { calc_isN_1 && ( tooth_wheel == 32 )}
       	calc_is_evo_trigger = { calc_is_coil && calc_is_sectrig_subaru_special }
        calc_is_lancia_cosworth = { ( primary_trigger & 161 ) == 33 }
        calc_is_maserati = { calc_is_fiatstilosubaru & ( tooth_wheel == 6 ) }
        calc_is_auditrigger = { ( primary_trigger &225 ) == 65 }
        calc_is_auditrigger_div_byN = { ( primary_trigger & 225 ) == 193 }

	calc_over_trigger_type15 = { 0 }
	calc_over_trigger_type14 = { calc_is_coil 		? 1  : calc_over_trigger_type15 }
	calc_over_trigger_type13 = { calc_isN_1 		? 2  : calc_over_trigger_type14 }
	calc_over_trigger_type12 = { calc_isN_2 		? 3  : calc_over_trigger_type13 }
	calc_over_trigger_type11 = { calc_over_trigger_type12 };more specials
	calc_over_trigger_type10 = { calc_is_extrapulse_trigger ? 14 : calc_over_trigger_type11 }

	calc_over_trigger_type9 = { calc_is_auditrigger_div_byN ? 13 : calc_over_trigger_type10 }
	calc_over_trigger_type8 = { calc_is_auditrigger 	? 12 : calc_over_trigger_type9 }
	calc_over_trigger_type7 = { calc_is_lancia_cosworth 	? 10 : calc_over_trigger_type8 }
	calc_over_trigger_type6 = { calc_is_fiatstilo 		? 9  : calc_over_trigger_type7 }
	calc_over_trigger_type5 = { calc_is_subaru6_7 		? 8  : calc_over_trigger_type6 }
	calc_over_trigger_type4 = { calc_is_subaru_32_2_2_2 	? 6  : calc_over_trigger_type5 }
	calc_over_trigger_type3 = { calc_is_suzuki_32_2_2_2 	? 7  : calc_over_trigger_type4 }
	calc_over_trigger_type2 = { calc_is_maserati 		? 11 : calc_over_trigger_type3 }
	calc_over_trigger_type1 = { calc_is_evo_trigger 	? 5  : calc_over_trigger_type2 }
	calc_over_trigger_type  = { calc_iselise 		? 4  : calc_over_trigger_type1 }  
	disp_over_trigger_type  = { calc_over_trigger_type }

	disp_over_trigger_tooth_number_special = { calc_is_maserati || calc_is_fiatstilo || calc_is_subaru6_7 || calc_is_subaru_32_2_2_2 || calc_is_suzuki_32_2_2_2 || calc_is_extrapulse_trigger }
	disp_over_trigger_tooth_number_full_cycle = { calc_is_auditrigger_div_byN || calc_is_auditrigger || calc_is_coil || calc_is_lancia_cosworth || calc_is_evo_trigger }

	disp_over_trigger_tooth_number_type1 = { disp_over_trigger_tooth_number_special ? 2 : 0 } 
	disp_over_trigger_tooth_number_type = { disp_over_trigger_tooth_number_full_cycle ? 1 : disp_over_trigger_tooth_number_type1 } 

	disp_over_trigger_tooth_number_div1 = { calc_is_auditrigger ? 3 : toothrel_missing }	
	disp_over_trigger_tooth_number_div = { ( calc_is_auditrigger_div_byN || calc_is_auditrigger ) ? disp_over_trigger_tooth_number_div1 : 1}
	disp_over_trigger_tooth_number = { tooth_wheel * disp_over_trigger_tooth_number_div }


	calc_over_trigger_cam3 = { (( secondary_trigger & 30 ) == 0 ) ? 4 : 0 }
	calc_over_trigger_cam2 = { (( secondary_trigger & 30 ) == 8 ) ? 3 : calc_over_trigger_cam3 }
	calc_over_trigger_cam1 = { (( secondary_trigger & 30 ) == 24 ) ? 2 : calc_over_trigger_cam2 }
	disp_over_trigger_cam = { (( secondary_trigger & 30 ) == 2 ) ? 1 : calc_over_trigger_cam1 }

	disp_over_motorsport_shift   = { (( shiftcut_conf_input  & 48  ) == 0   ) ? 2 : 1 }
        disp_over_motorsport_als     = { (( als_launch_input     & 240 ) == 192 ) ? 2 : 1 }
	disp_over_motorsport_n2o     = { (( n2o_settings         & 1   ) == 0   ) ? 2 : 1 }
	disp_over_motorsport_trans   = { (( transb_channel       & 15  ) == 15  ) ? 2 : 1 }
	disp_over_motorsport_launch  = { (( als_launch_input     & 15  ) == 12  ) ? 2 : 1 }
	calc_over_motorsport_anytrimnew23 = { ((( anytrim2_type_raw & 240 ) == 240 ) && (( anytrim3_type_raw    & 240 ) == 240 )) ? 1 : 0  }
	calc_over_motorsport_anytrimnew = { ((( anytrim1_type_raw   & 240 ) == 240 ) && calc_over_motorsport_anytrimnew23 ) ? 2 : 1 }
	calc_over_motorsport_anytrimold23 = { ((( anytrim2_raw & 240 ) != 240 ) || (( anytrim3_raw    & 240 ) != 240 )) ? 1 : 0  }
	calc_over_motorsport_anytrimold = { ((( anytrim1_raw  & 240 ) != 240 ) || calc_over_motorsport_anytrimold23 ) ? 1 : 2 }
	disp_over_motorsport_anytrim = { calc_over_motorsport_anytrimnew ? calc_over_motorsport_anytrimnew : calc_over_motorsport_anytrimold }
	disp_over_motorsport_cam     = { ((( vvti_channel        & 15  ) == 15  ) && ( (camshaft_ex_channel_names & 15 ) == 15 ))? 2 : 1 }

