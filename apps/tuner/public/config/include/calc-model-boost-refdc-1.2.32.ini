    calc_boostRefDc2= { calc_boostRefDc1_2 - calc_boostRefDc_mat_reduction}

	calc_boostRefDc_egt_reduction2 = {(egt1 - boost_egtdec) / 40 * 15.625 / 100}
; +40C  => -15.625% of DC
    calc_boostRefDc_egt_reduction1= { calc_boostRefDc_egt_reduction2 > 0 ? (calc_boostRefDc2 > calc_boostRefDc_egt_reduction2 ? calc_boostRefDc_egt_reduction2 : calc_boostRefDc2)  : 0 }
