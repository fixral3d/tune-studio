; +10C removing 15.625%
    calc_boostRefDc_mat_reduction1= { calc_boostRefDc_mat_reduction2 > 0 ? (calc_boostRefDc1_1 > calc_boostRefDc_mat_reduction2 ? calc_boostRefDc_mat_reduction2 : calc_boostRefDc1_1)  : 0 }
