	calc_spark_anytrim5_special_launchtime_tps50 = { (throttle >= 50) ? interpolate2d("calc_anytrim_bin_launch_tps","anytrim5_spark_array",calc_launchtime) : 0 }
    calc_spark_anytrim5_special_launchtime = { interpolate2d("calc_anytrim_bin_launch","anytrim5_spark_array",calc_launchtime) }
	calc_spark_anytrim5_special_speed1M2 = { interpolate2d("calc_anytrim_bin_speedM","anytrim5_spark_array",speed1M2) }
    calc_spark_anytrim5_special_speed1S2 = { interpolate2d("calc_anytrim_bin_speedS","anytrim5_spark_array",speed1S2) }
    calc_spark_anytrim5_special_speed2 = { interpolate2d("calc_anytrim_bin_speed","anytrim5_spark_array",speed2) }
    calc_spark_anytrim5_special_speed1 = { interpolate2d("calc_anytrim_bin_speed","anytrim5_spark_array",speed) }
    calc_spark_anytrim5_traditional_mcp = { interpolate2d("calc_anytrim_bin_mcp","anytrim5_spark_array",calc_anytrim5_mcp_val) }
    calc_spark_anytrim5_traditional_fpr = { interpolate2d("calc_anytrim_bin_fpr","anytrim5_spark_array",calc_anytrim5_fpr_val) }
    calc_spark_anytrim5_traditional_map = { interpolate2d("calc_anytrim_bin_map","anytrim5_spark_array",map) }
	calc_spark_anytrim5_special15 = { ( anytrim5_raw == 22) ? calc_spark_anytrim5_special_clt : 0 } 
	calc_spark_anytrim5_special14 = { ( anytrim5_raw == 23) ? calc_spark_anytrim5_special_mat : calc_spark_anytrim5_special15 } 
	calc_spark_anytrim5_special13 = { ( anytrim5_raw == 24) ?  calc_spark_anytrim5_special_tps : calc_spark_anytrim5_special14} 
	calc_spark_anytrim5_special12 = { ( anytrim5_raw == 25) ? calc_spark_anytrim5_special_vbatt : calc_spark_anytrim5_special13 } 
	calc_spark_anytrim5_special11 = { ( anytrim5_raw == 26) ? calc_spark_anytrim5_special_egt1 : calc_spark_anytrim5_special12 } 
	calc_spark_anytrim5_special10 = { ( anytrim5_raw == 27) ? calc_spark_anytrim5_special_egt2 : calc_spark_anytrim5_special11 } 
	calc_spark_anytrim5_special9 = { ( anytrim5_raw == 28) ? calc_spark_anytrim5_special_secpos : calc_spark_anytrim5_special10 } 
	calc_spark_anytrim5_special8 = { ( anytrim5_raw == 29) ? calc_spark_anytrim5_special_thrdpos : calc_spark_anytrim5_special9 } 
	calc_spark_anytrim5_special7 = { ( anytrim5_raw == 30) ? calc_spark_anytrim5_special_secposM : calc_spark_anytrim5_special8 } 
	calc_spark_anytrim5_special6 = { ( anytrim5_raw == 31) ? calc_spark_anytrim5_special_thrdposM : calc_spark_anytrim5_special7 } 
	calc_spark_anytrim5_special5 = { ( anytrim5_raw == 21 ) ? calc_spark_anytrim5_special_launchtime_tps50 : calc_spark_anytrim5_special6 }
    calc_spark_anytrim5_special4 = { ( anytrim5_raw == 20 ) ? calc_spark_anytrim5_special_launchtime : calc_spark_anytrim5_special5 }
	calc_spark_anytrim5_special3 = { ( anytrim5_raw == 19 ) ? calc_spark_anytrim5_special_speed1M2 : calc_spark_anytrim5_special4 }
    calc_spark_anytrim5_special2 = { ( anytrim5_raw == 18 ) ? calc_spark_anytrim5_special_speed1S2 : calc_spark_anytrim5_special3 }
    calc_spark_anytrim5_special1 = { ( anytrim5_raw == 17 ) ? calc_spark_anytrim5_special_speed2 : calc_spark_anytrim5_special2 }
    calc_spark_anytrim5_special = { ( anytrim5_raw == 16 ) ? calc_spark_anytrim5_special_speed1 : calc_spark_anytrim5_special1 }
	calc_spark_anytrim5_traditional_mcp_or_fpr = { (anytrim5_raw > 8) ? calc_spark_anytrim5_traditional_fpr : calc_spark_anytrim5_traditional_mcp}
    calc_spark_anytrim5_traditional = { (anytrim5_raw == 8) ?  calc_spark_anytrim5_traditional_map : calc_spark_anytrim5_traditional_mcp_or_fpr}
    calc_spark_anytrim51 = { ( anytrim5_raw > 15 ) ? calc_spark_anytrim5_special : calc_spark_anytrim5_traditional }
	
	; apply end result
    calc_spark_anytrim5 = { ((anytrim5_type_raw & 240) == 32 ) ? calc_spark_anytrim51 : 0 }
; 	eof anytrim section linked to firmware 1.2.32 if anything changes update this - end - DB	

	calc_spark81 = { calc_spark8 + calc_spark_anytrim3 }
	calc_spark82 = { calc_spark81 + calc_spark_anytrim5 }

	calc_spark_fix_retard_speed1 = { (interpolate2d("SparkSpeedBins","fix_retard_table",speed) ) }
    calc_spark_fix_retard_speed = { ( speed <= 32 ) ? 0 : calc_spark_fix_retard_speed1 }
    calc_spark_fix_retard_gear = { switchCase8( (gear & 7) , 0 , 0 , fix_retard1 , fix_retard2 , fix_retard3 , fix_retard4 , fix_retard5 , 0 ) }
    calc_spark_fix_retard = { ( config11 & 1 )  ? calc_spark_fix_retard_speed : calc_spark_fix_retard_gear }
    calc_spark83 = { calc_spark82 - calc_spark_fix_retard }

; 	< 1.2.23 was 2 value interpolate
; 	=> 1.2.23 full 4x4 cell map, clt/load ign adjust - DB
	calc_spark_cold_clt_map = {interpolate3d("clt_ign_adjust_BinsClt","clt_ign_adjust_BinsMap","clt_ign_adjust_table",coolant,map)}
    calc_spark_cold_clt_tps = {interpolate3d("clt_ign_adjust_BinsClt","clt_ign_adjust_BinsTps","clt_ign_adjust_table",coolant,calc_kpa_tps_blend_tps)}
    calc_spark_cold1 = { (calc_is_alphan) ?  calc_spark_cold_clt_tps : calc_spark_cold_clt_map }
	calc_spark_cold  = { isCranking ? 0 : calc_spark_cold1 }
	calc_spark9 = { calc_spark83 + calc_spark_cold }

  	calc_spark_crank2 = {interpolate(cranking_thres,rpmBinsSpark_0,ign_crank_advance,calc_spark9,rpm)}
	calc_spark_crank1 = { rpm < rpmBinsSpark_0 ? calc_spark_crank2 : calc_spark9 }
	calc_spark_crank = { isCranking ? ign_crank_advance : calc_spark_crank1}
    calc_spark10 = { calc_spark_crank }

	calc_spark_shiftcut1= {-1*(shiftcut_ret_raw & 240) / 4 }
	calc_spark_shiftcut = { ((rpm > rpmBinsSpark_0) && (isShiftCut)) ? calc_spark_shiftcut1 : calc_spark10  }
    calc_spark11 = { calc_spark_shiftcut }

; 	not entirely accurate with the way knock retard is applied above, its actually applied after retard clamp
 	calc_spark_clamp = { calc_spark11 < ignretard_clamp ? ignretard_clamp : calc_spark11 }
    calc_spark12 = { calc_spark_clamp }

	calc_spark_dif = { calc_spark12 - spark }

