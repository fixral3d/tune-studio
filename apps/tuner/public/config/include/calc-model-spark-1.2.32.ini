[HiddenOutputChannels]

;	Calculation Spark Angle

    calc_spark_rpm_map = {interpolate3d("rpmBinsSpark","mapBinsSpark","sparkTable",rpm,hybridmaptps)}
    calc_spark_rpm_tps = {interpolate3d("rpmBinsSpark","tpsBinsSpark","sparkTable",rpm,calc_kpa_tps_blend_tps)}
    calc_spark1_1 = { calc_spark_rpm_map }
    calc_spark1_2 = { calc_spark_rpm_tps }
    calc_spark1 = { (ignlambdaYaxis) ?  calc_spark_rpm_tps : calc_spark_rpm_map }

    calc_spark_launch1 = {calc_gammaEnrichment_launch2 * launch_retard}
    calc_spark_launch = { ( isLaunch_input_active_calc && !isLaunch_speed_depend_active_calc ) ? calc_spark_launch1 : 0 };
    calc_spark2 = { calc_spark1 - calc_spark_launch}

	calc_spark_als2_Y1_relative = { als_retard }
	calc_spark_als2_Y1_absolute = { calc_spark2 + (als_retard > 64 ? 64 : als_retard)}
	
	calc_spark_als2_Y1 = { als_retard_mode ? calc_spark_als2_Y1_relative : calc_spark_als2_Y1_absolute }
	
	calc_spark_als2 = { interpolate(als_retard_mintps ,als_retard_maxtps , calc_spark_als2_Y1 ,0, throttle) }
	calc_spark_als1 = { interpolate(als_retard_rpm1 ,als_retard_rpm2 , 0 , calc_spark_als2 , rpm) }
	
	calc_spark_als = { als_retard_active ? calc_spark_als1 : 0 }
    calc_spark3 = { calc_spark2 - calc_spark_als };

#if KNOCK_ALTERNATIVE
	; 1.2.15 and up applied even when als or launch
    ; calc_spark_knock = {(isALsFuncActive || calc_launch_active) ? 0 : worst_knockadjust}
	calc_spark_knock = { worst_knockadjust }
#else
	; calc_spark_knock = {(isALsFuncActive || calc_launch_active) ? 0 : knock_cyl_0_adjust}
	calc_spark_knock = { knock_cyl_0_adjust }
#endif

    calc_spark4 = { calc_spark3 - calc_spark_knock }

    calc_spark_iac32= { -1 * calc_iacRpmDif / 256 * iac_ign_slope}
    calc_spark_iac22= {calc_spark_iac32 > iac_ign_retard_limit ? (-1 * iac_ign_retard_limit) : (-1 * calc_spark_iac32) }

    calc_spark_iac31= {calc_iacRpmDif / 256 * iac_ign_slope}
    calc_spark_iac21= {calc_spark_iac31 > iac_ign_advance_limit ? iac_ign_advance_limit : calc_spark_iac31}

	calc_spark_iac1 = { calc_iacRpmDif > 0 ? calc_spark_iac21 : calc_spark_iac22}

	; simple condition, but correct - DB
    calc_spark_iac = { ( iac_advance&& isIAC && !(isALsFuncActive || calc_launch_active) ) ? calc_spark_iac1 : 0} 
    calc_spark5 = { calc_spark4 + calc_spark_iac }

    calc_spark_mat1 = { (isALsFuncActive || calc_launch_active) ? 0 : interpolate3d("matTpsRetardMatBins","matTpsRetardTpsBins","matTpsRetardTable",mat,throttle)}
    calc_spark_mat = { matretard ? 0 : calc_spark_mat1 }
    calc_spark6 = { calc_spark5 - calc_spark_mat }

	calc_spark_acc = { als_retard_active ? 0 : calc_accelRetard0}
    calc_spark7 = { calc_spark6 - calc_spark_acc }

    calc_spark_n2o = { calc_n2o_active ? n2o_retard : 0  }
    calc_spark8 = { calc_spark7 - calc_spark_n2o}
	
; 	anytrim section linked to firmware 1.2.32 if anything changes update this - start - DB
	calc_spark_anytrim3_special_clt = { interpolate2d("calc_anytrim_bin_ntc","anytrim3_spark_array",coolant) }
	calc_spark_anytrim3_special_mat = { interpolate2d("calc_anytrim_bin_ntc","anytrim3_spark_array",mat) }
	calc_spark_anytrim3_special_tps = { interpolate2d("calc_anytrim_bin_tps","anytrim3_spark_array",throttle) }
	calc_spark_anytrim3_special_vbatt = { interpolate2d("calc_anytrim_bin_batt","anytrim3_spark_array",batteryVoltage) }
	calc_spark_anytrim3_special_egt1 = { interpolate2d("calc_anytrim_bin_egt","anytrim3_spark_array",egt1) }
	calc_spark_anytrim3_special_egt2 = { interpolate2d("calc_anytrim_bin_egt","anytrim3_spark_array",egt2) }
	calc_spark_anytrim3_special_secpos = { interpolate2d("calc_anytrim_bin_cam","anytrim3_spark_array",sectrig_angle_inlet) }
	calc_spark_anytrim3_special_thrdpos = { interpolate2d("calc_anytrim_bin_cam","anytrim3_spark_array",extrig_angle) }
	calc_spark_anytrim3_special_secposM = { interpolate2d("calc_anytrim_bin_camM","anytrim3_spark_array",calc_cam_target_diff) }
	calc_spark_anytrim3_special_thrdposM = { interpolate2d("calc_anytrim_bin_camM","anytrim3_spark_array",calc_cam_target_diffE) }
	calc_spark_anytrim3_special_launchtime_tps50 = { (throttle >= 50) ? interpolate2d("calc_anytrim_bin_launch_tps","anytrim3_spark_array",calc_launchtime) : 0 }
    calc_spark_anytrim3_special_launchtime = { interpolate2d("calc_anytrim_bin_launch","anytrim3_spark_array",calc_launchtime) }
	calc_spark_anytrim3_special_speed1M2 = { interpolate2d("calc_anytrim_bin_speedM","anytrim3_spark_array",speed1M2) }
    calc_spark_anytrim3_special_speed1S2 = { interpolate2d("calc_anytrim_bin_speedS","anytrim3_spark_array",speed1S2) }
    calc_spark_anytrim3_special_speed2 = { interpolate2d("calc_anytrim_bin_speed","anytrim3_spark_array",speed2) }
    calc_spark_anytrim3_special_speed1 = { interpolate2d("calc_anytrim_bin_speed","anytrim3_spark_array",speed) }
    calc_spark_anytrim3_traditional_mcp = { interpolate2d("calc_anytrim_bin_mcp","anytrim3_spark_array",calc_anytrim3_mcp_val) }
    calc_spark_anytrim3_traditional_fpr = { interpolate2d("calc_anytrim_bin_fpr","anytrim3_spark_array",calc_anytrim3_fpr_val) }
    calc_spark_anytrim3_traditional_map = { interpolate2d("calc_anytrim_bin_map","anytrim3_spark_array",map) }
	calc_spark_anytrim3_special15 = { ( anytrim3_raw == 22) ? calc_spark_anytrim3_special_clt : 0 } 
	calc_spark_anytrim3_special14 = { ( anytrim3_raw == 23) ? calc_spark_anytrim3_special_mat : calc_spark_anytrim3_special15 } 
	calc_spark_anytrim3_special13 = { ( anytrim3_raw == 24) ?  calc_spark_anytrim3_special_tps : calc_spark_anytrim3_special14} 
	calc_spark_anytrim3_special12 = { ( anytrim3_raw == 25) ? calc_spark_anytrim3_special_vbatt : calc_spark_anytrim3_special13 } 
	calc_spark_anytrim3_special11 = { ( anytrim3_raw == 26) ? calc_spark_anytrim3_special_egt1 : calc_spark_anytrim3_special12 } 
	calc_spark_anytrim3_special10 = { ( anytrim3_raw == 27) ? calc_spark_anytrim3_special_egt2 : calc_spark_anytrim3_special11 } 
	calc_spark_anytrim3_special9 = { ( anytrim3_raw == 28) ? calc_spark_anytrim3_special_secpos : calc_spark_anytrim3_special10 } 
	calc_spark_anytrim3_special8 = { ( anytrim3_raw == 29) ? calc_spark_anytrim3_special_thrdpos : calc_spark_anytrim3_special9 } 
	calc_spark_anytrim3_special7 = { ( anytrim3_raw == 30) ? calc_spark_anytrim3_special_secposM : calc_spark_anytrim3_special8 } 
	calc_spark_anytrim3_special6 = { ( anytrim3_raw == 31) ? calc_spark_anytrim3_special_thrdposM : calc_spark_anytrim3_special7 } 
	calc_spark_anytrim3_special5 = { ( anytrim3_raw == 21 ) ? calc_spark_anytrim3_special_launchtime_tps50 : calc_spark_anytrim3_special6 }
    calc_spark_anytrim3_special4 = { ( anytrim3_raw == 20 ) ? calc_spark_anytrim3_special_launchtime : calc_spark_anytrim3_special5 }
	calc_spark_anytrim3_special3 = { ( anytrim3_raw == 19 ) ? calc_spark_anytrim3_special_speed1M2 : calc_spark_anytrim3_special4 }
    calc_spark_anytrim3_special2 = { ( anytrim3_raw == 18 ) ? calc_spark_anytrim3_special_speed1S2 : calc_spark_anytrim3_special3 }
    calc_spark_anytrim3_special1 = { ( anytrim3_raw == 17 ) ? calc_spark_anytrim3_special_speed2 : calc_spark_anytrim3_special2 }
    calc_spark_anytrim3_special = { ( anytrim3_raw == 16 ) ? calc_spark_anytrim3_special_speed1 : calc_spark_anytrim3_special1 }
	calc_spark_anytrim3_traditional_mcp_or_fpr = { (anytrim3_raw > 8) ? calc_spark_anytrim3_traditional_fpr : calc_spark_anytrim3_traditional_mcp}
    calc_spark_anytrim3_traditional = { (anytrim3_raw == 8) ?  calc_spark_anytrim3_traditional_map : calc_spark_anytrim3_traditional_mcp_or_fpr}
    calc_spark_anytrim31 = { ( anytrim3_raw > 15 ) ? calc_spark_anytrim3_special : calc_spark_anytrim3_traditional }
	
	; apply end result
    calc_spark_anytrim3 = { ((anytrim3_type_raw & 240) == 32 ) ? calc_spark_anytrim31 : 0 }
; 	eof anytrim section linked to firmware 1.2.32 if anything changes update this - end - DB	

; 	anytrim section linked to firmware 1.2.32 if anything changes update this - start - DB
	calc_spark_anytrim5_special_clt = { interpolate2d("calc_anytrim_bin_ntc","anytrim5_spark_array",coolant) }
	calc_spark_anytrim5_special_mat = { interpolate2d("calc_anytrim_bin_ntc","anytrim5_spark_array",mat) }
	calc_spark_anytrim5_special_tps = { interpolate2d("calc_anytrim_bin_tps","anytrim5_spark_array",throttle) }
	calc_spark_anytrim5_special_vbatt = { interpolate2d("calc_anytrim_bin_batt","anytrim5_spark_array",batteryVoltage) }
