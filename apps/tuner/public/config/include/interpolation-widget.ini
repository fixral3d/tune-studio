[InterpolationWidget]
	;  calc_warmup_rpm_scaling0 = { interpolate(rpmBinsVEmin,rpmBinsVEmax,1,warmup_rpm_scale / 100,rpm) }
	interpolationWidget = warmup_rpm_scaling, "Warmup Rpm Scaling"
		realtime = rpm
		xAxis	= 0, 10000, 11, "%.0f", "RPM"
		yAxis	= 0, 100,11, "%.0f", "%"
		xMin 	= rpmBinsVEmin, {0}
		xMax 	= rpmBinsVEmax, {0}
		yMin 	= warmup_rpm_scale, {1}
		yMax 	= 100, {0}

	; { interpolate(30,100,1,warmup_map_scale / 100,map) }
	interpolationWidget = warmup_map_scaling, "Warmup Map Scaling"
		realtime = map
		xAxis	= 0, 110, 12, "%.0f", "kPa"
		yAxis	= 0, 100,11, "%.0f", "%"
		xMin 	= 30, {0}
		xMax 	= 100, {0}
		yMin 	= warmup_map_scale, {1}
		yMax 	= 100, {0}


    interpolationWidget = lambda_egt_corr, "Lambda EGT corr."
		realtime = egt1
		xAxis	= 0, 1100, 12, "%.0f", "C"
		yAxis	= 0, 100,11, "%.0f", "%"
		xMin 	= boost_egtdec, {1}
		xMax 	= disp_lambdaTarget_egt_Xmax, {0}
		yMin 	= disp_lambdaTarget_Y1, {0}
		yMax 	= 0, {0}

    interpolationWidget = iac_target_rpm, "IAC target RPM"
		realtime = coolant
		xAxis	= -40, 110, 9, "%.0f", "coolant"
		yAxis	= 0, 2000, 11, "%.0f", "RPM"
		xMin 	= iac_cold_idle_temp, {1}
		xMax 	= iac_warm_idle_temp, {1}
		yMin 	= iac_warm_rpm, {1}
		yMax 	= iac_cold_rpm, {1}

	;calc_spark_als2 = { interpolate(als_retard_mintps ,als_retard_maxtps , als_retard + calc_spark2 ,0 , throttle) }
		interpolationWidget = sparkAls2, "sparkAls2"
		realtime = throttle
		xAxis	= 0, 100, 11, "%.0f", " tps %"
		yAxis	= 0, 100, 11, "%.0f", " als deg"
		xMin 	= als_retard_mintps, {0}
		xMax 	= als_retard_maxtps, {0}
		yMin 	= 0, {0}
		yMax 	= calc_spark_als2_Y1, {0}

	;calc_spark_als1 = { interpolate(als_retard_rpm1 ,als_retard_rpm2 , 0 , calc_spark_als2 , rpm) }
        interpolationWidget = sparkAls1, "sparkAls1"
		realtime = rpm
		xAxis	= 0, 10000, 11, "%.0f", "RPM"
		yAxis	= 0, 500,11, "%.0f", "kpa"
		xMin 	= als_retard_rpm1, {0}
		xMax 	= als_retard_rpm2, {0}
		yMin 	= 0, {0}
		yMax 	= calc_spark_als2, {0}

	;calc_spark_cold2 = {interpolate(0,warmup_clt_bins9,cold_ignadj,0,coolant)}
	interpolationWidget = sparkCold2, "sparkCold2"
		realtime = coolant
		xAxis	= -40, 100, 8, "%.0f", "coolant"
		yAxis	= 0, 500,11, "%.0f", "kpa"
		xMin 	= 0, {0}
		xMax 	= warmup_clt_bins9, {0}
		yMin 	= cold_ignadj, {0}
		yMax 	= 0, {0}

	;calc_spark_cold1 = {interpolate(70,140,calc_spark_cold2,0,map)}
    interpolationWidget = sparkCold1, "sparkCold1"
		realtime = map
		xAxis	= -40, 100, 8, "%.0f", "coolant"
		yAxis	= 0, 500,11, "%.0f", "kpa"
		xMin 	= 70, {0}
		xMax 	= 140, {0}
		yMin 	= calc_spark_cold2, {0}
		yMax 	= 0, {0}

  	;calc_spark_crank2= {interpolate(cranking_thres,rpmBinsSpark_0,ign_crank_advance,calc_spark9,rpm)}
    interpolationWidget = sparkCrank2, "sparkCrank2"
		realtime = rpm
		xAxis	= 0, 10000, 11, "%.0f", "RPM"
		yAxis	= 0, 500,11, "%.0f", "kpa"
		xMin 	= cranking_thres, {0}
		xMax 	= rpmBinsSpark_0, {0}
		yMin 	= calc_spark9, {0}
		yMax 	= 0, {0}

