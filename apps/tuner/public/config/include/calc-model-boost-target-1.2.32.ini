	calc_boostTarget_anytrim4_add_special8 = { ( anytrim4_raw == 29) ? calc_boostTarget_anytrim4_add_special_thrdpos : calc_boostTarget_anytrim4_add_special9 } 
	calc_boostTarget_anytrim4_add_special7 = { ( anytrim4_raw == 30) ? calc_boostTarget_anytrim4_add_special_secposM : calc_boostTarget_anytrim4_add_special8 } 
	calc_boostTarget_anytrim4_add_special6 = { ( anytrim4_raw == 31) ? calc_boostTarget_anytrim4_add_special_thrdposM : calc_boostTarget_anytrim4_add_special7 } 
	calc_boostTarget_anytrim4_add_special5 = { ( anytrim4_raw == 21 ) ? calc_boostTarget_anytrim4_add_special_launchtime_tps50 : calc_boostTarget_anytrim4_add_special6 }
    calc_boostTarget_anytrim4_add_special4 = { ( anytrim4_raw == 20 ) ? calc_boostTarget_anytrim4_add_special_launchtime : calc_boostTarget_anytrim4_add_special5 }
	calc_boostTarget_anytrim4_add_special3 = { ( anytrim4_raw == 19 ) ? calc_boostTarget_anytrim4_add_special_speed1M2 : calc_boostTarget_anytrim4_add_special4 }
    calc_boostTarget_anytrim4_add_special2 = { ( anytrim4_raw == 18 ) ? calc_boostTarget_anytrim4_add_special_speed1S2 : calc_boostTarget_anytrim4_add_special3 }
    calc_boostTarget_anytrim4_add_special1 = { ( anytrim4_raw == 17 ) ? calc_boostTarget_anytrim4_add_special_speed2 : calc_boostTarget_anytrim4_add_special2 }
    calc_boostTarget_anytrim4_add_special = { ( anytrim4_raw == 16 ) ? calc_boostTarget_anytrim4_add_special_speed1 : calc_boostTarget_anytrim4_add_special1 }
	calc_boostTarget_anytrim4_add_traditional_mcp_or_fpr = { (anytrim4_raw > 8) ? calc_boostTarget_anytrim4_add_traditional_fpr : calc_boostTarget_anytrim4_add_traditional_mcp }
    calc_boostTarget_anytrim4_add_traditional = { (anytrim4_raw == 8) ?  calc_boostTarget_anytrim4_add_traditional_map : calc_boostTarget_anytrim4_add_traditional_mcp_or_fpr }
    calc_boostTarget_anytrim4_add1 = { ( anytrim4_raw > 15 ) ? calc_boostTarget_anytrim4_add_special : calc_boostTarget_anytrim4_add_traditional }
	
	; apply end result
    calc_boostTarget_anytrim4_add = { (anytrim4_fueltrim == 5) ? calc_boostTarget_anytrim4_add1 : 0 }
; 	eof anytrim section linked to firmware 1.2.32 if anything changes update this - end - DB

	calc_boostTarget1_1 = { calc_boostTarget1 * calc_boostTarget_anytrim2_mult }
    calc_boostTarget1_2 = { calc_boostTarget1_1 + calc_boostTarget_anytrim2_add }
	calc_boostTarget1_3 = { calc_boostTarget1_2 * calc_boostTarget_anytrim4_mult }
    calc_boostTarget1_4 = { calc_boostTarget1_3 + calc_boostTarget_anytrim4_add }

    calc_boostTarget_tps_scaling= { interpolate2d("boostTpsBin","boosttpsTable",throttle) / 100 }

    calc_boostTarget2 = { calc_boostTarget1_4 * calc_boostTarget_tps_scaling }
    disp_boostTarget2 = { calc_boostTarget2 }

	calc_boostTarget_mat_reduction1 = {4 * (mat - boost_matdec)}
    calc_boostTarget_mat_reduction= { calc_boostTarget_mat_reduction1 > 0 ? (calc_boostTarget2 > calc_boostTarget_mat_reduction1 ? calc_boostTarget_mat_reduction1 : calc_boostTarget2)  : 0 }

    calc_boostTarget3= { calc_boostTarget2 - calc_boostTarget_mat_reduction}

	calc_boostTarget_egt_reduction1 = {egt1 - boost_egtdec}
    calc_boostTarget_egt_reduction= { calc_boostTarget_egt_reduction1 > 0 ? (calc_boostTarget3 > calc_boostTarget_egt_reduction1 ? calc_boostTarget_egt_reduction1 : calc_boostTarget3)  : 0 }

    calc_boostTarget4 = { calc_boostTarget3 - calc_boostTarget_egt_reduction }

	calc_boost_mcp_val = { switchCase8( ( ( boost_input & 7 )  ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7) }
    calc_boost_value1 = { ( calc_boost_mcp_val * boostfac / 4096 ) + boost_offs}
	calc_boost_ext_input = { ( ( boost_more_raw & 96 ) == 96 ) ? calc_boost_value1 : -1000000 }

	; calc boost target when launch function is active, launch can only decrease target
	calc_boostTarget_Launch1 = { launch_maxkpa + (launch_kparange / 2) }
	calc_boostTarget_Launch = { (calc_boostTarget_Launch1 < calc_boostTarget4) ? calc_boostTarget_Launch1 : calc_boostTarget4 }
	
	calc_boostTarget5 = { (isLaunchCalc > 1) ? calc_boostTarget_Launch : calc_boostTarget4 }
	
[OutputChannels]
    disp_boostTarget_curve= {calc_boostTarget1 }
    disp_boostTarget1= {calc_boostTarget1 }
	
	disp_boostTarget_anytrim2_mult = { anytrim2_fueltrim == 4 }
	disp_boostTarget_anytrim2_used = { (anytrim2_fueltrim == 4 || anytrim2_fueltrim == 5) }
    disp_boostTarget_anytrim2_sub= { disp_boostTarget_anytrim2_mult ? ( calc_boostTarget_anytrim2_mult ) : calc_boostTarget_anytrim2_add }
    disp_boostTarget1_e = { disp_boostTarget_anytrim2_mult ? calc_boostTarget1_1 : calc_boostTarget1_2 }
	
	disp_boostTarget_anytrim4_mult = { anytrim4_fueltrim == 4 }
	disp_boostTarget_anytrim4_used = { (anytrim4_fueltrim == 4 || anytrim4_fueltrim == 5) }
    disp_boostTarget_anytrim4_sub= { disp_boostTarget_anytrim4_mult ? ( calc_boostTarget_anytrim4_mult ) : calc_boostTarget_anytrim4_add }
    disp_boostTarget1_e = { disp_boostTarget_anytrim4_mult ? calc_boostTarget1_3 : calc_boostTarget1_4 }
	
	
    disp_boostTarget_tps_scaling= { calc_boostTarget_tps_scaling * 100 }
    disp_boostTarget_mat_reduction= { calc_boostTarget_mat_reduction }
    disp_boostTarget3= { calc_boostTarget3 }
    disp_boostTarget_egt_reduction= { calc_boostTarget_egt_reduction }
    disp_boostTarget4= { calc_boostTarget4 }
	
	; launch components
	disp_boostTarget_Launch = { calc_boostTarget_Launch }
	disp_boostTarget5 = { calc_boostTarget5 }
	
    disp_boostTarget_calc = { calc_boostTarget5 }
	disp_boostTargetE={ boost_tgt }
    disp_boostTarget_diff={ boost_tgt - calc_boostTarget5 }
[OutputChannels]
