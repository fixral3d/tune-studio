[HiddenOutputChannels]
	;Calculation Gamma Enrichment
    calc_gammaEnrichment_warm = { ( warmupEnrich < 600 ) ? ( warmupEnrich / 100) : ( calc_warmup_enrich0 / 100 ) }
    calc_gammaEnrichment1 = {calc_gammaEnrichment_warm}
    calc_gammaEnrichment_air = { interpolate3d("matTempBins","matTpsBins","matCorrTable",mat,throttle) / 100 }
    calc_gammaEnrichment2 = {calc_gammaEnrichment1 * calc_gammaEnrichment_air}
    calc_gammaEnrichment_baro = {baroCorrection / 100}
    calc_gammaEnrichment3 = {calc_gammaEnrichment2 * calc_gammaEnrichment_baro}
    calc_gammaEnrichment_batch_divider = { ( calc_isCranking &&  (  ( alternate & 16 ) == 16 ) ) ? cranking_div : 1}
    calc_gammaEnrichment4 = {calc_gammaEnrichment3 / calc_gammaEnrichment_batch_divider}
;    calc_gammaEnrichment_ego = {egoCorrection / 100}
;    calc_gammaEnrichment5 = {calc_gammaEnrichment4 * calc_gammaEnrichment_ego}
    calc_gammaEnrichment_launch_rpm_max = { calc_launchRpmTarget0 - launch_retard_rpmrange }
    calc_gammaEnrichment_launch_rpm_min = { calc_gammaEnrichment_launch_rpm_max -1000}
    calc_gammaEnrichment_launch2 = { interpolate(calc_gammaEnrichment_launch_rpm_min,calc_gammaEnrichment_launch_rpm_max,0,1,rpm)}
    ;launchrpm - margin -100 : 0% enrich... launchrpm -margin: 100% enrich
    calc_gammaEnrichment_launch1 = { calc_gammaEnrichment_launch2 * launch_enrich / 100 + 1}
    calc_gammaEnrichment_launch = { ( isLaunch_input_active_calc && !isLaunch_speed_depend_active_calc ) ? calc_gammaEnrichment_launch1 : 1}
;    calc_gammaEnrichment_launch = { ( isLaunch_input_active_calc ) ? calc_gammaEnrichment_launch1 : 1}

    calc_gammaEnrichment6 = {calc_gammaEnrichment4 * calc_gammaEnrichment_launch}
    calc_gammaEnrichment_als_cond = { calc_als_active }

    calc_gammaEnrichment_als3 = { als_enrich / 100}
    calc_gammaEnrichment_als2 = { interpolate(als_retard_mintps, als_retard_maxtps,calc_gammaEnrichment_als3 , 0, throttle) }
    calc_gammaEnrichment_als1 = {calc_gammaEnrichment_als2 + 1 }
    calc_gammaEnrichment_als = { calc_gammaEnrichment_als_cond ? calc_gammaEnrichment_als1 : 1}
    calc_gammaEnrichment7 = {calc_gammaEnrichment6 * calc_gammaEnrichment_als}
    calc_gammaEnrichment_n2o1 = { n2o_rich / 100 }
    calc_gammaEnrichment_n2o = { calc_n2o_active ? calc_gammaEnrichment_n2o1 : 1 }
    calc_gammaEnrichment8 = {calc_gammaEnrichment7 * calc_gammaEnrichment_n2o}
    calc_gammaEnrichmentE = { gammaEnrich }

[OutputChannels]
    disp_gammaEnrichment_warm = {calc_gammaEnrichment_warm * 100}
    disp_gammaEnrichment1 = {calc_gammaEnrichment1 * 100}
    disp_gammaEnrichment_air = {calc_gammaEnrichment_air * 100}
    disp_gammaEnrichment2 = {calc_gammaEnrichment2 * 100}
    disp_gammaEnrichment_baro = {calc_gammaEnrichment_baro * 100}
    disp_gammaEnrichment3 = {calc_gammaEnrichment3 * 100}
    disp_gammaEnrichment_batch_divider = {calc_gammaEnrichment_batch_divider}
    disp_gammaEnrichment4 = {calc_gammaEnrichment4 * 100}
;    disp_gammaEnrichment_ego = {calc_gammaEnrichment_ego * 100}
;    disp_gammaEnrichment5 = {calc_gammaEnrichment5 * 100}
    disp_gammaEnrichment_launch = {calc_gammaEnrichment_launch * 100}
    disp_gammaEnrichment6 = {calc_gammaEnrichment6 * 100}
    disp_gammaEnrichment_als = {calc_gammaEnrichment_als * 100}
    disp_gammaEnrichment7 = {calc_gammaEnrichment7 * 100}
    disp_gammaEnrichment_n2o = {calc_gammaEnrichment_n2o * 100}
    disp_gammaEnrichment8 = {calc_gammaEnrichment8 * 100}
    disp_gammaEnrichment_calc = {disp_gammaEnrichment8 }

    disp_gammaEnrichmentE = {calc_gammaEnrichmentE }
    disp_gammaEnrichment_diff = { gammaEnrich - disp_gammaEnrichment8 }

[HiddenOutputChannels]
    calc_baro_value_static = { 102 - (baroCorrection - 100) / 0.401  }

    calc_baro_mcp_val = { switchCase8( ( ( baro_mode & 112 ) / 16 ) ,raw_adc_ch0 ,raw_adc_ch1 ,raw_adc_ch2 ,raw_adc_ch3 ,raw_adc_ch4 ,raw_adc_ch5 ,raw_adc_ch6 ,raw_adc_ch7) }
    calc_baro_value1_dinamic1 = { ( calc_baro_mcp_val * barofac / 4096 ) + baro_offs}
    calc_baro_value1_dinamic = { ( calc_baro_value1_dinamic1 > 0 ) ? calc_baro_value1_dinamic1 : 0 }

    calc_baro_value1= { ( ( baro_mode & 128 ) == 128 ) ? calc_baro_value1_dinamic : calc_baro_value_static }
    calc_baro_value = { ( ( config13 & 8 ) == 8 ) ? calc_baro_value1 : -1000000 }
[OutputChannels]
