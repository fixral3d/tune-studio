	table = veTableTbl, {!alphan}
	table = veTableTblTPS, {alphan}
	
	supertable = camshaftangle1table, camshaftangle1table3D, "Camshaft Inlet target Table"
	table = camshaftangle1tableMAP, {!alphan}
	table = camshaftangle1tableTPS, {alphan}
	
	supertable = camshaftangle2table, camshaftangle2table3D, "Camshaft Exhaust target Table"
