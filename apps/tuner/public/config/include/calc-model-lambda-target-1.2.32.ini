
[HiddenOutputChannels]
	
;	Calculation Lambda Target

	calc_lambdaTarget_rpm_map = {interpolate3d("rpmBinsLambda","mapBinsLambda","lambdaTable",rpm,hybridmaptps)}
    calc_lambdaTarget_rpm_tps = {interpolate3d("rpmBinsLambda","tpsBinsLambda","lambdaTable",rpm,calc_kpa_tps_blend_tps)}
    calc_lambdaTarget1 = { calc_lambdaTarget_rpm_map }
    calc_lambdaTarget2 = { calc_lambdaTarget_rpm_tps }
    calc_lambdaTarget_active = { ignlambdaYaxis ?  calc_lambdaTarget_rpm_tps : calc_lambdaTarget_rpm_map }

#if KNOCK_ALTERNATIVE
    calc_lambdaTarget_knock_corr2 = { worst_knockadjust } 
    calc_lambdaTarget_knock_corr1 = { ((knock_rich * calc_lambdaTarget_knock_corr2) + 100) / 100 }
	
;	knock correction not applied when cranking	
	calc_lambdaTarget_knock_corr = { isCranking ? 1 : calc_lambdaTarget_knock_corr1 }
    calc_lambdaTarget3 = { calc_lambdaTarget_active / calc_lambdaTarget_knock_corr }
#else
	calc_lambdaTarget_knock_corr = { 1 }
    calc_lambdaTarget3 = { calc_lambdaTarget_active }
#endif

	calc_lambdaTarget_egt_a = { (egt_rich / 100) / 100 }
	calc_lambdaTarget_egt_Xmax = {calc_lambdaTarget_egt_a == 0 ? boost_egtdec : ( calc_lambdaTarget3 / calc_lambdaTarget_egt_a + boost_egtdec) }
    calc_lambdaTarget_egt_corr = {egt1 > boost_egtdec ? ( calc_lambdaTarget_egt_a * (egt1 - boost_egtdec) ) : 0}
    calc_lambdaTarget4 = { calc_lambdaTarget3 - calc_lambdaTarget_egt_corr }
	
