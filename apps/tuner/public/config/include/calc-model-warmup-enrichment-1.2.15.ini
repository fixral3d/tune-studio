[HiddenOutputChannels]
	;Calculation Warmup enrichment
	calc_warmup_enrich_norm0 = { interpolate2d ("warmup_clt_bins","warmup_clt",coolant) }
    calc_warmup_enrich      = { calc_warmup_enrich_norm0 - 100}

    calc_warmup_rpm_scaling0 = { interpolate(rpmBinsVEmin,rpmBinsVEmax,1,warmup_rpm_scale / 100,rpm) }
    calc_warmup_enrich1     = { calc_warmup_enrich * calc_warmup_rpm_scaling0}

    calc_warmup_map_scaling0 = { interpolate(30,100,1,warmup_map_scale / 100,map) }
    calc_warmup_enrich2     = { calc_warmup_enrich1 * calc_warmup_map_scaling0}

    calc_warmup_enrich3     = {calc_warmup_enrich2 +100}

    calc_warmup_enrich_aftercoolant1 = { interpolate2d("cranking_coolant_range","afterstart_enrich",coolant) }
    calc_warmup_enrich_aftercoolant0 = { calc_isAfterStart ? calc_warmup_enrich_aftercoolant1 / 100 : 1}
    calc_warmup_enrich4     = { calc_warmup_enrich3 * calc_warmup_enrich_aftercoolant0}

    calc_warmup_enrich_aftertime1 = {1}
    calc_warmup_enrich_aftertime0 = {calc_isAfterStart ? calc_warmup_enrich_aftertime1 : 1}
    calc_warmup_enrich5     = { calc_warmup_enrich4 * calc_warmup_enrich_aftertime0 }

    calc_warmup_enrich_crank1 = {interpolate2d("cranking_coolant_range","crank_enrich",coolant) }
    calc_warmup_enrich_crank0 = {calc_isCranking ? calc_warmup_enrich_crank1 / 100 : 1 }
    calc_warmup_enrich6     = { calc_warmup_enrich5 * calc_warmup_enrich_crank0}
	
