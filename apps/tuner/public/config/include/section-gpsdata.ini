[GPSData]
rawLatitude 	= scalar, S32,  3, "",	1.000, 0.000
rawLongitude 	= scalar, S32,  7, "",	1.000, 0.000
rawHeight	 	= scalar, U24, 11, "",	1.000, 0.000
rawKnots	 	= scalar, U16, 14, "",	1.000, 0.000
capturedIdx		= scalar, U08, 16, "",	1.000, 0.000
rawDate			= scalar, U16, 17, "",  1.000, 0.000
rawTime			= scalar, U16, 19, "",  1.000, 0.000

latitude	=	{  rawLatitude / 1000000 }
floorLat 	=	{ floor(latitude ) }
latitudeDec	=	{  floorLat + ( latitude - floorLat )   / 60 * 100 }

longitude	=	{ rawLongitude / 1000000 }
floorLong 	=	{ floor( longitude ) }
longitudeDec	=	{  floorLong + ( longitude - floorLong )  / 60  * 100 }

distance = 	{ getGpsDistance( latitudeDec, longitudeDec ) } 
course 	 = 	{ getGpsCourse( latitudeDec, longitudeDec ) }
distanceSum = { sum( distance ) } , distanceSum
height 		= 	{ ( rawHeight - 10000 ) / 10 }
; 1 knots = 1.85200 km/h
gpsSpeed	=   { rawKnots / 10 * 1.852 }

gpsDateD ={ ( rawDate >> 11 ) & 31}
gpsDateM ={ ( rawDate >> 7 ) & 15}
gpsDateY ={ rawDate & 127 }

gpsTimeH = { floor (rawTime / 1000 )}
gpsTimeM = { floor ((rawTime / 10) - (gpsTimeH*100))  }
gpsTimeS = { floor( rawTime - (gpsTimeH*1000) - (gpsTimeM * 10))*10  }

