; VEMS V3 ECU simulator on Waveshare ESP32-S3-Touch-LCD-2.1 (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM,
; 480x480 ST7701 RGB panel, CST820 touch). Speaks the TriggerFrame protocol over the native USB port (COM),
; so VemsTune and the VEMS Tuner app connect to it like a real ECU. See README.md.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -Isrc
lib_deps =
  lvgl/lvgl@8.3.10
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
